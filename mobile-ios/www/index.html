<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2d5c">
  <title>Radio Românii din Italia</title>
  <style>
    :root{color-scheme:light;--ink:#0b2d5c;--blue:#1268d5;--gold:#ffd032;--muted:#637695;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf3ff,#f8fbff 56%);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:620px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:12px;margin:4px 0 24px}.logo{width:58px;height:58px;object-fit:contain;border-radius:15px;background:#fff;box-shadow:0 5px 18px #0a34631a}
    h1{font-size:22px;line-height:1.1;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .hero{overflow:hidden;border-radius:24px;background:#0b2d5c;box-shadow:0 12px 30px #0b2d5c28}.hero>img{display:block;width:100%;height:142px;object-fit:cover;opacity:.94}
    .player{margin:-20px 14px 14px;position:relative;border-radius:20px;background:var(--panel);padding:17px;box-shadow:0 8px 24px #00183824}
    .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#b51b2d}.live i{width:8px;height:8px;border-radius:50%;background:#ee3344}.track{margin:11px 0 3px;font-size:19px;font-weight:800;line-height:1.25}.sub{min-height:20px;color:var(--muted);font-size:13px}
    .controls{display:flex;gap:10px;margin-top:17px}.controls button{border:0;border-radius:14px;padding:13px 16px;font:700 15px inherit;cursor:pointer}.play{flex:1;background:var(--blue);color:#fff}.secondary{background:#edf3fb;color:var(--ink)}
    .volume{display:flex;align-items:center;gap:10px;margin:16px 0 2px;color:var(--muted);font-size:13px}.volume input{accent-color:var(--blue);width:100%}
    .section{margin:26px 0 0}.section h2{font-size:19px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:100px;border:0;border-radius:17px;background:#fff;color:var(--ink);padding:14px;text-align:left;box-shadow:0 5px 16px #0b2d5c12;font:inherit;cursor:pointer}.tile b{display:block;margin-top:7px}.tile span{font-size:24px}.tile small{display:block;color:var(--muted);margin-top:5px;font-size:12px;line-height:1.3}.notice{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="https://radioromanii.duckdns.org/RADIO-LOGO.png" alt="">
      <div><h1>Radio Românii din Italia</h1><p>Acasă, oriunde ai fi.</p></div>
    </header>
    <section class="hero" aria-label="Radio live">
      <img src="https://radioromanii.duckdns.org/RADIO-COVER.jpg" alt="Radio Românii din Italia">
      <div class="player">
        <div class="live"><i></i> EMISIE LIVE · 24/7</div>
        <div id="track" class="track">Radio Românii din Italia</div>
        <div id="status" class="sub">Apasă Ascultă pentru a porni radioul</div>
        <div class="controls">
          <button id="play" class="play" type="button">▶ Ascultă</button>
          <button id="stop" class="secondary" type="button">■ Oprește</button>
        </div>
        <label class="volume">🔊 <input id="volume" type="range" min="0" max="100" value="75" aria-label="Volum"></label>
      </div>
    </section>
    <section class="section">
      <h2>Descoperă</h2>
      <div class="grid">
        <button class="tile" data-path="index.html#news-title"><span>📰</span><b>Știri</b><small>România, Italia și diaspora</small></button>
        <button class="tile" data-path="comunitate.html"><span>🤝</span><b>Comunitate</b><small>Evenimente și români în Italia</small></button>
        <button class="tile" data-path="ghid.html"><span>🇷🇴</span><b>Ghidul românilor</b><small>Servicii utile în Italia</small></button>
        <button class="tile" data-path="program.html"><span>🎙️</span><b>Emisiuni</b><small>Muzică, rubrici și programe</small></button>
      </div>
    </section>
    <p class="notice">Conținutul editorial și informațiile sunt actualizate pe radioromanii.duckdns.org.</p>
    <audio id="audio" preload="none" playsinline></audio>
  </main>
  <script>
    const stream="https://radio-romanii-italia.duckdns.org/listen/radio-romanii-italia/radio.mp3";
    const nowPlaying="https://radio-romanii-italia.duckdns.org/api/nowplaying/radio-romanii-italia";
    const audio=document.querySelector("#audio"),play=document.querySelector("#play"),stop=document.querySelector("#stop"),status=document.querySelector("#status"),track=document.querySelector("#track"),volume=document.querySelector("#volume");
    audio.volume=.75;
    function refreshButton(){const active=!audio.paused&&!audio.ended;play.textContent=active?"Ⅱ Pauză":"▶ Ascultă";status.textContent=active?"● Redare activă":"Apasă Ascultă pentru a porni radioul"}
    async function refreshTrack(){try{const data=await fetch(nowPlaying,{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject());const song=data?.now_playing?.song||{};const title=[song.artist,song.title].filter(Boolean).join(" — ");if(title)track.textContent=title}catch{}}
    play.addEventListener("click",async()=>{try{if(!audio.src){audio.src=stream;audio.load()}if(audio.paused)await audio.play();else audio.pause();refreshButton()}catch{status.textContent="Fluxul nu este disponibil momentan."}});
    stop.addEventListener("click",()=>{audio.pause();audio.removeAttribute("src");audio.load();refreshButton()});
    volume.addEventListener("input",()=>audio.volume=Number(volume.value)/100);
    ["play","pause","ended","error"].forEach(e=>audio.addEventListener(e,refreshButton));
    document.querySelectorAll("[data-path]").forEach(button=>button.addEventListener("click",()=>location.href="https://radioromanii.duckdns.org/"+button.dataset.path));
    refreshTrack();setInterval(refreshTrack,20000);
  </script>
</body>
</html>
