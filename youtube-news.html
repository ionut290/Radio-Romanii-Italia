<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Românii din Italia — Știri TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081526;color:white;font-family:Arial,Helvetica,sans-serif}
#stage{width:100vw;height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 10%,#214b7e,#0b1930 66%)}
#logo{position:absolute;top:18px;left:44px;font-weight:900;font-size:27px;letter-spacing:.5px;z-index:5}#badge{position:absolute;right:44px;top:22px;padding:10px 20px;background:#e53439;border-radius:6px;font-size:18px;font-weight:800;z-index:5}
#panel{position:absolute;top:92px;bottom:105px;left:44px;right:44px;display:grid;grid-template-columns:48% 52%;background:#112743;border:1px solid #40658d;border-radius:20px;overflow:hidden;box-shadow:0 16px 52px #0008}
#photo{width:100%;height:100%;object-fit:cover;background:linear-gradient(140deg,#1a4c7e,#0a1935)}#photoBox{height:100%;position:relative;overflow:hidden}#fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:130px;background:linear-gradient(135deg,#19365b,#09192d)}
#copy{padding:34px 36px;display:flex;flex-direction:column;justify-content:center;min-width:0}
#category{color:#ffe18b;letter-spacing:2px;font-weight:800;font-size:20px;text-transform:uppercase;margin-bottom:20px}
#headline{font-size:clamp(30px,3vw,46px);line-height:1.16;margin:0 0 22px;font-weight:900;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#summary{font-size:clamp(18px,1.65vw,25px);line-height:1.42;color:#dbe7f3;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin:0}
#source{margin-top:25px;font-size:17px;color:#a6bcd2}
#ticker{position:absolute;bottom:0;left:0;right:0;height:83px;background:#e7eef7;color:#102642;display:flex;align-items:center;overflow:hidden}
#tickerLabel{height:100%;background:#cf242e;color:white;display:flex;align-items:center;padding:0 30px;font-weight:900;letter-spacing:1px;font-size:21px;flex:none}
#tickerText{font-size:25px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 25px;flex:1;max-width:100%;animation:none;transition:opacity .5s ease}
#progress{height:5px;position:absolute;bottom:83px;left:0;background:#f0c05b;width:0;z-index:10}
@media(max-width:800px){#panel{grid-template-columns:45% 55%;left:18px;right:18px}#copy{padding:16px}#headline{font-size:25px}#summary{font-size:16px}#logo{font-size:20px;left:18px}}
</style></head><body><div id="stage"><div id="logo">🇷🇴 🇮🇹 RADIO ROMÂNII DIN ITALIA</div><div id="badge">● ȘTIRI LIVE</div>
<div id="panel"><div id="photoBox"><img id="photo" alt=""><div id="fallback">📰</div></div><div id="copy"><div id="category">ȘTIRI</div><h1 id="headline">Se încarcă știrile...</h1><p id="summary">Actualizări din România, Italia și diaspora românească.</p><div id="source">Radio Românii din Italia</div></div></div>
<div id="progress"></div><div id="ticker"><div id="tickerLabel">ACTUALITATE</div><div id="tickerText">RADIO ROMÂNII DIN ITALIA • Acasă, oriunde ai fi! • Știri, muzică și comunitate</div></div></div>
<script>
const $=id=>document.getElementById(id);const PERIOD=20000;let stories=[],index=0,timer=null;
function valid(x){return x&&typeof x.title==='string'&&x.title.trim().length>8}
async function load(){try{const [news,editorial]=await Promise.all([fetch('./news.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),fetch('./editorial.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]);const items=[...(editorial.items||[]),...(news.items||[])].filter(valid);const seen=new Set;stories=items.filter(x=>{const k=x.title.trim().toLocaleLowerCase('ro');if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>Date.parse(b.published||0)-Date.parse(a.published||0)).slice(0,40);if(index>=stories.length)index=0;if(stories.length)show();else $('headline').textContent='Radio Românii din Italia — Știri';}catch(e){console.warn('news load failed',e)}}
function show(){if(!stories.length)return;const x=stories[index%stories.length];$('category').textContent=x.category||'Actualitate';$('headline').textContent=x.title;$('summary').textContent=x.summary||'Citește mai multe pe site-ul Radio Românii din Italia.';$('source').textContent=[x.source||'Radio Românii din Italia',x.published?new Date(x.published).toLocaleDateString('ro-RO'):null].filter(Boolean).join(' • ');
const img=$('photo'),fb=$('fallback');img.style.display='none';fb.style.display='flex';fb.textContent=x.category==='Italia'?'🇮🇹':x.category==='România'?'🇷🇴':'📰';
if(x.image&&/^https:\/\//.test(x.image)){const url=x.image;img.onload=()=>{if(img.src===url){img.style.display='block';fb.style.display='none'}};img.onerror=()=>{img.style.display='none';fb.style.display='flex'};img.src=url;}
$('tickerText').textContent=x.title;$('progress').style.transition='none';$('progress').style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('progress').style.transition='width '+PERIOD+'ms linear';$('progress').style.width='100%'}))}
load();setInterval(()=>{if(stories.length){index=(index+1)%stories.length;show()}},PERIOD);setInterval(load,300000);
</script></body></html>
