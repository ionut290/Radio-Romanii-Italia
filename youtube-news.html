<!doctype html>
<html lang="ro" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Românii din Italia — Știri TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081526;color:white;font-family:Arial,Helvetica,sans-serif}

#rdiClockTime{display:block;font-size:24px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
#rdiClockDate{display:block;font-size:12px;color:#d3e5ff;margin-top:1px}
#appQr{position:absolute;top:9px;right:216px;left:auto;bottom:auto;z-index:7;background:#fff;color:#13223b;padding:3px;border-radius:6px;text-align:center;width:57px;box-shadow:0 3px 9px #0006}
#appQr img{display:block;width:51px;height:51px;object-fit:contain}
#appQr span{display:block;font-size:7px;font-weight:900;margin-top:1px}
#panel{position:absolute;top:92px;bottom:105px;left:44px;right:44px;display:grid;grid-template-columns:52% 48%;background:#fff;border:1px solid #d9e1eb;border-radius:20px;overflow:hidden;box-shadow:0 16px 52px #0008}
#photo{width:100%;height:100%;object-fit:contain;background:linear-gradient(140deg,#1a4c7e,#0a1935)}#photoBox{height:100%;position:relative;overflow:hidden}#fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:130px;background:linear-gradient(135deg,#19365b,#09192d)}
#copy{padding:32px 37px;display:flex;flex-direction:column;justify-content:center;min-width:0;color:#1e2d42;background:#fff}
#category{color:#344b68;background:#e9eef5;align-self:flex-start;padding:9px 17px;border-radius:999px;letter-spacing:0;font-weight:800;font-size:19px;text-transform:none;margin-bottom:22px}
#headline{font-size:clamp(28px,2.6vw,42px);line-height:1.16;margin:0 0 22px;font-weight:900;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
#summary{font-size:clamp(18px,1.65vw,25px);line-height:1.42;color:#526178;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin:0}
#source{margin-top:18px;font-size:16px;color:#69798b}
#businessContacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;max-height:96px;overflow:hidden}
#businessContacts:empty{display:none}
#businessContacts span{font-size:15px;font-weight:800;color:#163b62;background:#e9eff7;border-radius:8px;padding:9px 12px;overflow-wrap:anywhere}
#ticker{position:absolute;bottom:0;left:0;right:0;height:83px;background:#e7eef7;color:#102642;display:flex;align-items:center;overflow:hidden}
#tickerLabel{height:100%;background:#cf242e;color:white;display:flex;align-items:center;padding:0 30px;font-weight:900;letter-spacing:1px;font-size:21px;flex:none}
#tickerText{position:absolute;left:0;top:50%;font-size:24px;font-weight:700;white-space:nowrap;width:max-content;max-width:none;overflow:visible;margin:0;line-height:1.2;transform:translate(100vw,-50%);will-change:transform}#tickerLabel{position:relative;z-index:2}
#rdiExtras{position:absolute;z-index:8;left:44px;bottom:106px;width:calc((100% - 88px) * .56);max-width:none;min-width:0;min-height:52px;padding:8px 13px;background:rgba(7,23,43,.93);border:1px solid #6b8aaa;border-radius:9px;box-shadow:0 4px 14px #0008;pointer-events:none;overflow:hidden}#rdiExtras[hidden]{display:none}#rdiExtraLabel{display:block;color:#ffdf87;font-size:12px;font-weight:900;letter-spacing:1px}#rdiExtraValue{display:block;color:white;font-size:15px;font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin-top:3px}
#progress{height:5px;position:absolute;bottom:83px;left:0;background:#f0c05b;width:0;z-index:10}
@media(max-width:800px){#panel{grid-template-columns:45% 55%;left:18px;right:18px}#copy{padding:16px}#headline{font-size:25px}#summary{font-size:16px}#logo{font-size:20px;left:18px}}
</style></head><body><div id="stage"><div id="logo">🇷🇴 🇮🇹 RADIO ROMÂNII DIN ITALIA</div><div id="badge">● ȘTIRI LIVE</div><div id="rdiClock" aria-label="Ora Italiei"><span id="rdiClockTime">--:--</span><span id="rdiClockDate">ITALIA</span></div>
<div id="appQr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&amp;margin=6&amp;data=https%3A%2F%2Fradioromanii.duckdns.org%2F" alt="Cod QR aplicație RDI" onerror="this.style.display='none'"><span>APLICAȚIA RDI</span></div>
<div id="panel"><div id="photoBox"><img id="photo" alt=""><div id="fallback">📰</div></div><div id="copy"><div id="category">ȘTIRI</div><h1 id="headline">Se încarcă știrile...</h1><p id="summary">Actualizări din România, Italia și diaspora românească.</p><div id="source">Radio Românii din Italia</div><div id="businessContacts"></div></div></div>
<div id="rdiExtras" hidden><span id="rdiExtraLabel"></span><span id="rdiExtraValue"></span></div><div id="progress"></div><div id="ticker"><div id="tickerLabel">ACTUALITATE</div><div id="tickerText">RADIO ROMÂNII DIN ITALIA • Acasă, oriunde ai fi! • Știri, muzică și comunitate</div></div></div>
<script>
const $=id=>document.getElementById(id);
const clockTimeFmt=new Intl.DateTimeFormat('ro-RO',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const clockDateFmt=new Intl.DateTimeFormat('ro-RO',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',year:'numeric'});
function updateRdiClock(){const now=new Date();$('rdiClockTime').textContent=clockTimeFmt.format(now);$('rdiClockDate').textContent=clockDateFmt.format(now)+' · ORA ITALIEI'}
updateRdiClock();setInterval(updateRdiClock,1000);
let stories=[],index=0,started=false,tickerAnimation=null,nextTimer=null,sequence=0,photoTimer=null;window.rdiPromotions=[];
function valid(x){return x&&typeof x.title==='string'&&x.title.trim().length>8}
async function load(){
 try{
  const [news,editorial,eventData]=await Promise.all([
   fetch('./news.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
   fetch('./editorial.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
   fetch('./events-auto.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))
  ]);
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const events=(eventData.events||[]).filter(x=>valid(x)&&(x.endDate||x.date||'')>=today).map(x=>({
   category:'Evenimente',title:x.title,summary:x.description||[x.city,x.region].filter(Boolean).join(' · '),
   source:x.source||'Evenimente RDI',published:x.published||x.date||today,
   image:x.image||'',url:x.url||'',city:x.city||''
  }));
  const seen=new Set();
  const incoming=[...(window.rdiPromotions||[]),...(editorial.items||[]),...(news.items||[]),...events].filter(valid).filter(x=>{
   const key=x.category+'|'+x.title.trim().toLocaleLowerCase('ro');
   if(seen.has(key))return false;seen.add(key);return true;
  });
  // Round-robin among categories so no category or event gets buried behind dozens of headlines.
  const buckets=new Map();
  for(const x of incoming){
   const category=x.category||'Actualitate';
   if(!buckets.has(category))buckets.set(category,[]);
   buckets.get(category).push(x);
  }
  for(const group of buckets.values())group.sort((a,b)=>Date.parse(b.published||0)-Date.parse(a.published||0));
  const updated=[];
  while([...buckets.values()].some(group=>group.length)){
   for(const group of buckets.values()){if(group.length)updated.push(group.shift())}
  }
  if(updated.length){
   const current=stories[index]?.title;
   stories=updated;
   if(current){const position=stories.findIndex(x=>x.title===current);index=position>=0?position:0;}
   if(!started){started=true;show();}
  }else if(!started){$('headline').textContent='Radio Românii din Italia — Știri';}
 }catch(e){console.warn('News update failed',e)}
}
function show(){
 if(!stories.length)return;
 const x=stories[index%stories.length];
 $('category').textContent=x.category||'Actualitate';
 $('headline').textContent=x.title;
 $('summary').textContent=x.summary||'Citește mai multe pe site-ul Radio Românii din Italia.';
 $('source').textContent=[x.source||'Radio Românii din Italia',x.published?new Date(x.published).toLocaleDateString('ro-RO'):null].filter(Boolean).join(' • ');
 const contact=$('businessContacts');contact.replaceChildren();
 if(x.promotion){for(const [caption,value] of [['📞',x.phone],['💬 WhatsApp',x.whatsapp],['🌐',x.website],['📍',x.address]]){if(value){const tag=document.createElement('span');tag.textContent=caption+' '+value;contact.append(tag)}}}
 const img=$('photo'),fb=$('fallback');
 img.onload=null;img.onerror=null;img.removeAttribute('src');
 img.style.display='none';fb.style.display='flex';
 fb.textContent=x.category==='Italia'?'🇮🇹':x.category==='România'?'🇷🇴':x.category==='Evenimente'?'📅':'📰';
 if(x.image&&/^(https:\/\/|\/(?!\/)|\.\/(?!\/))/.test(x.image)){
  const url=x.image;
  img.onload=()=>{img.style.display='block';fb.style.display='none'};
  img.onerror=()=>{img.style.display='none';fb.style.display='flex'};
  img.src=url;
 }
 // Scroll the current article summary gently, then change the entire news card.
 const ticker=$('tickerText');
 ticker.textContent=[x.title,x.summary].filter(Boolean).join(' — ');
 startTicker();
}
function startTicker(){
 if(tickerAnimation){tickerAnimation.cancel();tickerAnimation=null}
 if(nextTimer){clearTimeout(nextTimer);nextTimer=null}
 const ticket=++sequence;
 const ticker=$('tickerText'),area=$('ticker'),label=$('tickerLabel');
 const start=area.clientWidth+30,end=-ticker.scrollWidth-30;
 const distance=start-end;
 const duration=Math.max(22000,Math.round(distance/60*1000)); // comfortable 60 px/second
 const progress=$('progress');
 progress.style.transition='none';progress.style.width='0%';
 ticker.style.transform='translate('+start+'px,-50%)';
 tickerAnimation=ticker.animate([
  {transform:'translate('+start+'px,-50%)'},
  {transform:'translate('+end+'px,-50%)'}
 ],{duration,easing:'linear',fill:'forwards'});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  progress.style.transition='width '+duration+'ms linear';progress.style.width='100%';
 }));
 tickerAnimation.onfinish=()=>{
  if(ticket!==sequence)return;
  nextTimer=setTimeout(()=>{
   if(ticket!==sequence)return;
   index=(index+1)%stories.length;
   show();
  },1300);
 };
}
load();setInterval(load,300000);
</script><script type="module" src="./youtube-promotions.js?v=20261022-1"></script><script type="module" src="./youtube-extras.js?v=20261022-numeric-fix-3"></script></body></html>
