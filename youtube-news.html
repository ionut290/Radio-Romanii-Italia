<script>
const $=id=>document.getElementById(id);
// The Chromium page on the server stays open for days. A small public build
// marker makes it reload itself after a new YouTube layout is deployed.
const RDI_YOUTUBE_BUILD='20261030-telegram-live-1';
async function refreshWhenDeployed(){
 try{
  const response=await fetch('./data/youtube-build.json?ts='+Date.now(),{cache:'no-store'});
  const data=response.ok?await response.json():null;
  if(data?.build&&data.build!==RDI_YOUTUBE_BUILD)location.reload();
 }catch(e){/* Keep the broadcast running if GitHub Pages is briefly unavailable. */}
}
setInterval(refreshWhenDeployed,60000);
const clockTimeFmt=new Intl.DateTimeFormat('ro-RO',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const clockDateFmt=new Intl.DateTimeFormat('ro-RO',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',year:'numeric'});
function updateRdiClock(){const now=new Date();$('rdiClockTime').textContent=clockTimeFmt.format(now);$('rdiClockDate').textContent=clockDateFmt.format(now)+' · ORA ITALIEI'}
updateRdiClock();setInterval(updateRdiClock,1000);
let stories=[],index=0,started=false,tickerAnimation=null,nextTimer=null,sequence=0,photoTimer=null;
function valid(x){return x&&typeof x.title==='string'&&x.title.trim().length>8}
async function load(){
 try{
  const [news,editorial,eventData]=await Promise.all([
   fetch('./news.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
   fetch('./editorial.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
   fetch('./events-auto.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))
  ]);
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const events=(eventData.events||[]).filter(x=>valid(x)&&(x.endDate||x.date||'')>=today).map(x=>({
   category:'Evenimente',title:x.title,summary:x.description||[x.city,x.region].filter(Boolean).join(' · '),
   source:x.source||'Evenimente RDI',published:x.published||x.date||today,
   image:x.image||'',url:x.url||'',city:x.city||''
  }));
  // Only today's publications in the Italian timezone enter the YouTube news rotation.
  // Events are included only when announced today; advertising appears only during actual AzuraCast spot audio.
  const romeDay=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'});
  function publishedToday(x){
    const raw=x&&x.published;
    if(typeof raw!=='string'||!raw.trim())return false;
    if(/^\\d{4}-\\d{2}-\\d{2}$/.test(raw.trim()))return raw.trim()===today;
    const stamp=new Date(raw);
    return !Number.isNaN(stamp.getTime())&&romeDay.format(stamp)===today;
  }
  const seen=new Set();
  const incoming=[...(editorial.items||[]).filter(publishedToday),...(news.items||[]).filter(publishedToday),...events.filter(publishedToday)].filter(valid).filter(x=>!x.promotion&&!/^(publicitate|pubblicit[aà]|advertising|sponsorizat[ăa]?|promovare|activități și servicii)$/i.test(String(x.category||"").trim())).filter(x=>{
   const key=x.category+'|'+x.title.trim().toLocaleLowerCase('ro');
   if(seen.has(key))return false;seen.add(key);return true;
  });
  // Round-robin among categories so no category or event gets buried behind dozens of headlines.
  const buckets=new Map();
  for(const x of incoming){
   const category=x.category||'Actualitate';
   if(!buckets.has(category))buckets.set(category,[]);
   buckets.get(category).push(x);
  }
  for(const group of buckets.values())group.sort((a,b)=>Date.parse(b.published||0)-Date.parse(a.published||0));
  const updated=[];
  while([...buckets.values()].some(group=>group.length)){
   for(const group of buckets.values()){if(group.length)updated.push(group.shift())}
  }
  if(updated.length){
   const current=stories[index]?.title;
   stories=updated;
   if(current){const position=stories.findIndex(x=>x.title===current);index=position>=0?position:0;}
   if(!started){started=true;show();}
  }else{stories=[];index=0;started=false;clearTimeout(nextTimer);nextTimer=null;$('headline').textContent='Nu sunt știri publicate astăzi';$('summary').textContent='Revenim cu actualizări din România, Italia și diaspora.';$('category').textContent='ȘTIRI';$('photo').removeAttribute('src');$('photo').style.display='none';$('fallback').style.display='flex';}
 }catch(e){console.warn('News update failed',e)}
}
// YouTube uses a short display excerpt; stored articles and Facebook copies stay complete.
function tvExcerpt(value,limit=160){
 const text=String(value||'').replace(/\s+/g,' ').trim();
 if(text.length<=limit)return text;
 const cut=text.slice(0,limit-1),space=cut.lastIndexOf(' ');
 return cut.slice(0,space>limit*.6?space:cut.length).trimEnd()+'…';
}
function show(){
 if(!stories.length||window.rdiSpotActive||window.rdiGeoActive||window.rdiTgActive||window.rdiWeatherActive||window.rdiDjPromoActive||window.rdiPhilosophyActive)return;
 if(window.rdiCameraActive||window.rdiLandscapeActive)return;
 const x=stories[index%stories.length];
 $('category').textContent=x.category||'Actualitate';
 $('headline').textContent=x.title;
 const displaySummary=tvExcerpt(x.summary);
 $('summary').textContent=displaySummary||'Citește mai multe pe site-ul Radio Românii din Italia.';
 $('source').textContent=[x.source||'Radio Românii din Italia',x.published?new Date(x.published).toLocaleDateString('ro-RO'):null].filter(Boolean).join(' • ');
 const img=$('photo'),fb=$('fallback');
 img.onload=null;img.onerror=null;img.removeAttribute('src');
 img.style.display='none';fb.style.display='flex';
 fb.textContent=x.category==='Italia'?'🇮🇹':x.category==='România'?'🇷🇴':x.category==='Evenimente'?'📅':'📰';
 // Publisher photos can block the Chromium instance used for the live stream.
 // Try the original once, then always load the RDI illustration stored with the story.
 const candidates=[x.image,x.fallbackImage].filter(url=>typeof url==='string'&&/^(https:\/\/|\/(?!\/)|\.\/(?!\/))/.test(url));
 let candidate=0;
 const loadPhoto=()=>{
  const url=candidates[candidate++];
  if(!url){img.style.display='none';fb.style.display='flex';return;}
  img.onload=()=>{img.style.display='block';fb.style.display='none';};
  img.onerror=loadPhoto;
  img.src=url;
 };
 loadPhoto();
 // Keep news moving even when the original article has a long summary.
 const ticker=$('tickerText');
 ticker.textContent=[tvExcerpt(x.title,100),displaySummary].filter(Boolean).join(' — ');
 startTicker(true);
}
// Ads pause the news timeline, so a resumed broadcast starts a clean card.
window.rdiPauseNews=function(){
 window.rdiCameraBreak?.stop();
 window.rdiLandscapeBreak?.stop();
 sequence++;
 if(nextTimer){clearTimeout(nextTimer);nextTimer=null;}
 if(tickerAnimation){tickerAnimation.cancel();tickerAnimation=null;}
};
window.rdiResumeNews=function(){
 if(window.rdiGeoActive||window.rdiTgActive||window.rdiWeatherActive||window.rdiDjPromoActive||window.rdiPhilosophyActive)return;
 if(stories.length)show();
 else load();
};
function startTicker(brief=false){
 if(tickerAnimation){tickerAnimation.cancel();tickerAnimation=null}
 if(nextTimer){clearTimeout(nextTimer);nextTimer=null}
 const ticket=++sequence;
 const cardDuration=30000; // Card timing is independent of ticker length.
 const ticker=$('tickerText'),area=$('ticker'),label=$('tickerLabel');
 const start=brief?label.offsetWidth+24:area.clientWidth+30,end=-ticker.scrollWidth-30;
 const distance=start-end;
 const duration=distance/60*1000; // Constant 60 pixels per second, even for long articles.
 const progress=$('progress');
 progress.style.transition='none';progress.style.width='0%';
 ticker.style.transform='translate('+start+'px,-50%)';
 tickerAnimation=ticker.animate([
  {transform:'translate('+start+'px,-50%)'},
  {transform:'translate('+end+'px,-50%)'}
 ],{duration,easing:'linear',fill:'forwards'});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(ticket!==sequence)return;
  progress.style.transition='width '+cardDuration+'ms linear';progress.style.width='100%';
 }));
 nextTimer=setTimeout(()=>{
  if(ticket!==sequence||!stories.length)return;
  const nextNews=()=>{index=(index+1)%stories.length;show();};
  // A fresh meteo update gets one 60-second visual slot between news cards.
  if(window.rdiWeatherBreak?.startIfDue(nextNews))return;
  // Daily philosophical interlude, visually separate from editorial news.\n  if(window.rdiPhilosophyBreak?.startIfDue(nextNews))return;\n  // RDI's own 16-second static promo appears between stories, never audio.
  if(window.rdiDjPromoBreak?.startIfDue(nextNews))return;
  // A licensed city camera replaces one 30-second news card, never audio or ads.
  if(window.rdiCameraBreak?.startIfDue(nextNews))return;
  if(window.rdiLandscapeBreak?.startIfDue(nextNews))return;
  if(window.rdiListenerMessageBreak?.startIfDue(nextNews))return;
  nextNews();
 },cardDuration);
}
load();setInterval(load,300000);
</script><script type="module" src="./youtube-philosophy.js?v=20261030-2"></script><script type="module" src="./youtube-dj-promo.js?v=20261030-dj-1"></script><script type="module" src="./youtube-camera-breaks.js?v=20261029-city-1"></script><script type="module" src="./youtube-landscapes.js?v=20261029-italy-romania-3"></script><script type="module" src="./youtube-extras.js?v=20261025-census-1"></script><script type="module" src="./youtube-weather.js?v=20261030-weather-4"></script><script type="module" src="./youtube-spots.js?v=20261025-enable-spots-1"></script><script defer src="./youtube-geopolitica.js?v=20261027-1"></script><script defer src="./youtube-tg-sera.js?v=20261030-footage-2"></script><script defer src="./youtube-live-messages.js?v=20261030-live-messages-1"></script></body></html>
