<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>RDI AI MUSIC | Radio Românii din Italia</title>
<meta name="description" content="Invia la tua musica originale creata con l'intelligenza artificiale a Radio Românii din Italia.">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#304967,#0b1323 70%);color:#f6f8fc;font-family:system-ui,-apple-system,sans-serif;line-height:1.55}main{max-width:820px;margin:auto;padding:24px 18px 72px}a{color:#f3ce7b}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header a{text-decoration:none;font-weight:700}h1{font-size:clamp(34px,7vw,57px);line-height:1.1;margin:42px 0 12px}.lead{font-size:18px;color:#c5d3e7}.card{background:#17283f;border:1px solid #435776;border-radius:20px;padding:24px;margin-top:24px}label{display:block;margin-top:18px;font-weight:700}input,select,textarea{display:block;margin-top:7px;width:100%;background:#0b1729;border:1px solid #71829b;border-radius:11px;color:white;padding:13px;font:inherit}input:focus,textarea:focus,select:focus{outline:2px solid #f3ce7b;outline-offset:1px}button{background:#f2c66c;border:0;border-radius:12px;padding:14px 20px;color:#13223b;font:inherit;font-weight:800;cursor:pointer}small,.muted{color:#bac9dd}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.notice{padding:12px;border-left:3px solid #f2c66c;background:#21344b;margin-top:16px}footer{margin-top:36px;color:#aab9ce}select#lang{width:auto;margin:0}
</style></head><body><main><header><a href="./index.html">← Radio Românii din Italia</a><select id="lang" aria-label="Language"><option value="ro">Română</option><option value="it">Italiano</option><option value="en">English</option></select></header>
<h1>RDI <span style="color:#f2c66c">AI MUSIC</span></h1><p class="lead" data-t="intro"></p>
<section class="card"><h2 data-t="howTitle"></h2><p data-t="how"></p><p class="muted" data-t="free"></p></section>
<section class="card"><h2 data-t="formTitle"></h2><p class="muted" data-t="formInfo"></p>
<form id="submission">
<label><span data-t="artist"></span><input id="artist" name="artist" maxlength="100" autocomplete="name" required></label>
<label><span data-t="email"></span><input type="email" id="email" name="email" maxlength="200" autocomplete="email" required></label>
<label><span data-t="title"></span><input id="song" name="song" maxlength="160" required></label>
<label><span data-t="platform"></span><select id="platform" required><option value="">—</option><option>Mureka</option><option>Suno</option><option>Udio</option><option value="Other">Other</option></select></label>
<label><span data-t="link"></span><input id="link" type="url" name="link" placeholder="https://..." maxlength="1500" required></label>
<label><span data-t="notes"></span><textarea id="notes" rows="3" maxlength="800"></textarea></label>
<label class="check"><input id="rights" type="checkbox" required><span data-t="rights"></span></label>
<label class="check"><input id="privacy" type="checkbox" required><span data-t="privacy"></span></label>
<div class="notice" data-t="notice"></div><p><button type="submit" data-t="send"></button></p><p id="status" role="status" aria-live="polite"></p></form></section>
<footer><span data-t="footer"></span> · <a href="./index.html">Radio Românii din Italia</a></footer></main>
<script>
const t={
ro:{intro:"Un spațiu pentru creatorii independenți care produc muzică originală cu Mureka, Suno și alte instrumente AI.",howTitle:"Cum funcționează",how:"Trimite linkul către piesa ta. Redacția o va evalua; doar piesele acceptate vor putea intra ulterior în playlistul special și în rotația generală a radioului.",free:"Participarea este gratuită. Trimiterea nu garantează difuzarea.",formTitle:"Propune o piesă",formInfo:"În această primă versiune trimitem propunerea prin aplicația ta de e-mail. Nu încărcăm fișiere audio pe site.",artist:"Nume de artist / pseudonim",email:"Adresa de e-mail",title:"Titlul piesei",platform:"Platforma folosită",link:"Link public sau partajabil către piesă",notes:"Detalii opționale",rights:"Declar că dețin drepturile și permisiunile necesare pentru a propune această piesă spre difuzare radio și că folosirea platformei îmi permite acest lucru.",privacy:"Sunt de acord ca datele furnizate să fie folosite pentru evaluarea propunerii și contactarea mea.",notice:"Apăsând butonul se va deschide programul de e-mail, cu mesajul pregătit. Verifică destinatarul și trimite mesajul manual.",send:"Pregătește e-mailul",footer:"Creatori independenți, muzică nouă",missing:"Destinatarul redacției nu este configurat încă. Copiază textul de mai jos și trimite-l redacției RDI.",ready:"Mesajul este pregătit. Trimite-l din aplicația ta de e-mail."},
it:{intro:"Uno spazio dedicato agli artisti indipendenti che creano musica originale con Mureka, Suno e altri strumenti AI.",howTitle:"Come funziona",how:"Proponi il link al tuo brano. La redazione lo valuterà; soltanto i brani approvati potranno successivamente entrare nella playlist dedicata e nella rotazione generale della radio.",free:"La partecipazione è gratuita. L'invio non garantisce la trasmissione.",formTitle:"Proponi un brano",formInfo:"In questa prima versione la proposta viene preparata nella tua app email. Non vengono caricati file audio sul sito.",artist:"Nome d'arte / pseudonimo",email:"Indirizzo email",title:"Titolo del brano",platform:"Piattaforma utilizzata",link:"Link pubblico o condivisibile al brano",notes:"Note facoltative",rights:"Dichiaro di disporre dei diritti e dei permessi necessari per proporre questo brano alla diffusione radiofonica e che le condizioni della piattaforma lo consentono.",privacy:"Acconsento all'uso dei dati forniti per valutare la proposta e ricontattarmi.",notice:"Il pulsante apre l'app email con un messaggio precompilato. Verifica il destinatario e invia manualmente.",send:"Prepara email",footer:"Artisti indipendenti, nuova musica",missing:"L'indirizzo della redazione non è ancora configurato. Copia il testo qui sotto e invialo alla redazione RDI.",ready:"Messaggio pronto. Invialo dalla tua applicazione email."},
en:{intro:"A home for independent artists creating original music with Mureka, Suno and other AI tools.",howTitle:"How it works",how:"Share a link to your song. The editorial team will review it; only approved tracks may later be added to the dedicated playlist and the radio's general rotation.",free:"Participation is free. Submission does not guarantee airplay.",formTitle:"Submit a track",formInfo:"This first version prepares a message in your email app. No audio files are uploaded to the website.",artist:"Artist name / stage name",email:"Email address",title:"Song title",platform:"Platform used",link:"Public or shareable track link",notes:"Optional notes",rights:"I confirm that I have the rights and permissions required to propose this track for radio broadcast and that the platform's terms allow it.",privacy:"I agree that my provided information may be used to review this submission and contact me.",notice:"The button opens your email app with a prepared message. Verify the recipient and send it manually.",send:"Prepare email",footer:"Independent creators, new music",missing:"The editorial inbox has not been configured yet. Copy the text below and send it to the RDI editorial team.",ready:"Message prepared. Send it from your email app."}
};const picker=document.getElementById('lang');let lang=localStorage.getItem('rdi-language')||'ro';if(!t[lang])lang='ro';picker.value=lang;function tr(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[lang][el.dataset.t]);}picker.onchange=()=>{lang=picker.value;localStorage.setItem('rdi-language',lang);tr()};tr();
document.getElementById('submission').addEventListener('submit',e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();const body=['RDI AI MUSIC – Submission','Artist: '+v('artist'),'Email: '+v('email'),'Track: '+v('song'),'Platform: '+v('platform'),'Link: '+v('link'),'Notes: '+v('notes'),'Rights declaration: confirmed','Privacy acknowledgement: confirmed'].join('\n');const target='';const status=document.getElementById('status');if(!target){status.textContent=t[lang].missing;const area=document.createElement('textarea');area.readOnly=true;area.rows=10;area.value=body;status.replaceChildren(document.createTextNode(t[lang].missing),area);return}window.location.href='mailto:'+target+'?subject='+encodeURIComponent('RDI AI MUSIC: '+v('song'))+'&body='+encodeURIComponent(body);status.textContent=t[lang].ready;});
</script></body></html>
