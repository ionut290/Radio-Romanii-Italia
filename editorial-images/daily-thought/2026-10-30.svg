<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="La calma non è fermarsi: è non lasciare alla fretta il compito di scegliere per noi.">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101d39"/><stop offset=".58" stop-color="#6c5877"/><stop offset="1" stop-color="#e9a16a"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#46546b"/><stop offset="1" stop-color="#172e43"/></linearGradient>
 <linearGradient id="shade" x2="1"><stop stop-color="#0b1729" stop-opacity=".98"/><stop offset=".72" stop-color="#0b1729" stop-opacity=".78"/><stop offset="1" stop-color="#0b1729" stop-opacity=".15"/></linearGradient>
 <linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#ffd18a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd18a" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<circle cx="963" cy="286" r="83" fill="#ffd58d" opacity=".95"/>
<path d="M0 358 Q180 296 355 343 T700 330 T1200 352 V630 H0Z" fill="#344654"/>
<path d="M0 390 Q190 356 400 383 T805 372 T1200 393 V630 H0Z" fill="url(#water)"/>
<path d="M888 374 Q966 385 1045 374 L1120 630 H823Z" fill="url(#reflection)" opacity=".54"/>
<path d="M0 445 Q175 428 330 444 M0 490 Q220 469 440 489 M697 430 Q880 449 1200 427 M610 523 Q835 500 1200 517" fill="none" stroke="#b5c4c8" stroke-opacity=".24" stroke-width="3"/>
<path d="M0 0 H1200 V630 H0Z" fill="url(#shade)"/>
<path d="M1072 0 Q1060 130 1155 179 M1130 0 Q1120 91 1190 126" fill="none" stroke="#d6a675" stroke-width="7" opacity=".4"/>
<text x="82" y="92" fill="#f3c66b" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5">PENSIERO DEL GIORNO · 30 OTTOBRE 2026</text>
<path d="M82 124 H670" stroke="#f3c66b" stroke-width="2" opacity=".8"/>
<text fill="#fffaf1" font-family="Georgia,serif" font-size="48" font-weight="bold"><tspan x="82" y="197">La calma non è fermarsi:</tspan><tspan x="82" y="258">è non lasciare alla fretta</tspan><tspan x="82" y="319">il compito di scegliere per noi.</tspan></text>
<text fill="#f8f0e4" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="82" y="389">Quando tutto sembra urgente, una pausa breve</tspan><tspan x="82" y="424">rimette in ordine le priorità. A volte il passo giusto</tspan><tspan x="82" y="459">è quello che ci permette di restare presenti.</tspan></text>
<text x="82" y="555" fill="#f3c66b" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">RADIO ROMÂNII DIN ITALIA</text>
<text x="1118" y="92" fill="#fff" fill-opacity=".78" text-anchor="end" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">SENZA FRETTA</text>
</svg>