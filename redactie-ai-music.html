<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RDI AI MUSIC | Redazione</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#f5f7fc;font:16px system-ui}main{max-width:1100px;padding:24px;margin:auto}h1{margin:0;color:#f2c66c}.card{background:#17273c;border:1px solid #3b536d;border-radius:16px;padding:18px;margin:16px 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}input,textarea{width:100%;padding:10px;margin:8px 0;background:#0b1726;color:white;border:1px solid #71829b;border-radius:9px}button{cursor:pointer;padding:11px 15px;background:#f2c66c;border:0;border-radius:9px;font-weight:700;margin:5px 5px 5px 0;color:#172536}button.secondary{background:#d5deed}button.danger{background:#f19c9c}small,p{color:#c4d0e0}a{color:#f2c66c}.chip{font-size:12px;background:#384d66;border-radius:50px;padding:4px 8px}.actions{display:flex;flex-wrap:wrap;gap:4px}nav{display:flex;align-items:center;justify-content:space-between;gap:15px}</style></head><body><main><nav><h1>RDI AI MUSIC · Redazione</h1><a href="./index.html">← Radio</a></nav><p>Area privata: candidature ricevute e revisione manuale. I brani approvati non vengono trasmessi automaticamente.</p><section class="card"><label for="token">Token amministratore (non salvato sul sito)</label><input id="token" type="password" autocomplete="off" placeholder="Token amministratore" aria-label="Token amministratore"><button id="load">Carica candidature</button><button class="secondary" id="clear">Cancella token</button><p id="status" role="status" aria-live="polite"></p></section><section id="items" class="grid"></section></main><script>
let token='';const $=id=>document.getElementById(id);const status=s=>$('status').textContent=s;const el=(tag,txt)=>{const n=document.createElement(tag);n.textContent=txt??'';return n};
async function api(path,opt={}){const r=await fetch('https://radio-romanii-italia.duckdns.org/api/ai-music/admin/'+path,{...opt,credentials:'omit',headers:{Authorization:'Bearer '+token,...(opt.headers||{})},cache:'no-store'});if(!r.ok){let msg=r.status+' HTTP error';try{msg=(await r.json()).error||msg}catch{}throw Error(msg)}return r}
async function load(){token=$('token').value.trim();if(!token){status('Inserisci il token amministratore');return}status('Caricamento…');try{const payload=await (await api('submissions')).json();render(payload.submissions||[]);status('Candidature: '+payload.submissions.length)}catch(e){status('Errore: '+e.message)}}
function render(items){$('items').replaceChildren();if(!items.length){$('items').append(el('p','Nessuna candidatura presente.'));return}
for(const it of items){const c=el('article');c.className='card';const heading=el('h2',it.title+' · '+it.artist);const chip=el('span',it.status);chip.className='chip';c.append(heading,chip,el('p',it.platform+' · '+new Date(it.created_at).toLocaleString('it-IT')));const mail=el('p','Contatto: '+it.email);c.append(mail);if(it.link){const a=el('a','Apri link brano');a.href=it.link;a.target='_blank';a.rel='noopener noreferrer';c.append(a)}if(it.file_name){const download=el('button','Scarica audio: '+it.file_name);download.className='secondary';download.onclick=async()=>{try{const b=await (await api('submissions/'+encodeURIComponent(it.id)+'/audio')).blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=it.file_name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}catch(e){status(e.message)}};c.append(download);
const permission=el('div');permission.style.cssText='margin-top:14px;padding:12px;background:#233b55;border-radius:10px';
permission.append(el('p','Anteprima Spotlight: '+(it.spotlight_consent?'abilitata':'non autorizzata')));
const consentLabel=el('label');consentLabel.style.cssText='display:flex;gap:10px;align-items:flex-start';
const consentBox=el('input');consentBox.type='checkbox';consentBox.style.cssText='width:auto;flex:none;margin-top:5px';
consentLabel.append(consentBox,el('span',"Confermo che l'artista ha autorizzato espressamente l'ascolto pubblico di questo file su RDI AI MUSIC Spotlight."));
permission.append(consentLabel);
const allow=el('button','Attiva Play pubblico');allow.className='secondary';
allow.disabled=it.spotlight_consent||it.status!=='approved';
allow.onclick=async()=>{if(!consentBox.checked){status("Conferma prima il consenso esplicito dell'artista.");return}allow.disabled=true;try{await api('submissions/'+encodeURIComponent(it.id)+'/spotlight-consent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:true,artist_permission_confirmed:true})});status('Play pubblico abilitato');await load()}catch(e){status('Errore: '+e.message);allow.disabled=false}};
permission.append(allow);
if(it.spotlight_consent){const disable=el('button','Disattiva Play pubblico');disable.className='danger';disable.onclick=async()=>{disable.disabled=true;try{await api('submissions/'+encodeURIComponent(it.id)+'/spotlight-consent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:false})});status('Play pubblico disattivato');await load()}catch(e){status('Errore: '+e.message);disable.disabled=false}};permission.append(disable)}
c.append(permission)
}if(it.notes)c.append(el('p','Note artista: '+it.notes));const comment=el('textarea');comment.rows=2;comment.placeholder='Nota redazionale (facoltativa)';comment.value=it.reviewed_note||'';c.append(comment);const actions=el('div');actions.className='actions';for(const [value,label,klass] of [['approved','Approva',''],['rejected','Rifiuta','danger'],['pending','Rimetti in attesa','secondary']]){const b=el('button',label);b.className=klass;b.onclick=async()=>{b.disabled=true;try{await api('submissions/'+encodeURIComponent(it.id)+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:value,note:comment.value})});status('Candidatura aggiornata');await load()}catch(e){status('Errore: '+e.message)}finally{b.disabled=false}};actions.append(b)}c.append(actions);$('items').append(c)}}
$('load').onclick=load;$('clear').onclick=()=>{token='';$('token').value='';$('items').replaceChildren();status('Token cancellato')};$('token').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script></body></html>
