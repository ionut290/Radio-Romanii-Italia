name: Articoli editoriali automatici
on:
  schedule:
    - cron: '*/15 5-19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-editorial-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrivi due articoli nella fascia oraria italiana
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/publish_editorial.py
      - name: Pubblica archivio
        run: |
          if [ -n "$(git status --porcelain -- editorial.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add editorial.json
            git commit -m "Pubblica articoli editoriali"
            git pull --rebase
            git push
          fi
