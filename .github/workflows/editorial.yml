name: Actualizare diaspora fara API
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radio-editorial-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preia proiectul
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifică sintaxa editorului
        run: python -m py_compile scripts/publish_editorial.py
      - name: Actualizează știrile din surse RSS
        run: python scripts/publish_editorial.py
      - name: Verifică arhiva JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          archive = json.loads(Path("editorial.json").read_text(encoding="utf-8"))
          assert isinstance(archive.get("items"), list)
          print(f"Arhiva validă: {len(archive['items'])} articole")
          PY
      - name: Salvează actualizările pe GitHub
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- editorial.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nicio știre nouă sau expirată."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial.json
          git commit -m "Actualizează știrile despre diaspora"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Conflict cu alte modificări editoriale. Publicarea va fi reîncercată la următoarea execuție."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push concurent ($attempt/3); reîncerc în 5 secunde."
            sleep 5
          done
          echo "::error::Nu s-a putut publica editorial.json după trei încercări."
          exit 1
      - name: Pornește publicarea site-ului
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST "repos/${{ github.repository }}/actions/workflows/deploy-site.yml/dispatches" -f ref=main; then
              echo "Publicarea site-ului a fost solicitată."
              exit 0
            fi
            echo "Solicitarea publicării a eșuat ($attempt/3); reîncerc în 10 secunde."
            sleep 10
          done
          echo "::error::Articolele au fost salvate în GitHub, dar publicarea site-ului nu a putut fi declanșată."
          exit 1
