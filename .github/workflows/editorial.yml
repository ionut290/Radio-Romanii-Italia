name: Actualizare diaspora fara API
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-editorial-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verifică și pregătește știri diaspora din RSS
        run: python scripts/publish_editorial.py
      - name: Pubblica archivio
        run: |
          if [ -n "$(git status --porcelain -- editorial.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add editorial.json
            git commit -m "Pubblica articoli editoriali"
            git pull --rebase
            git push
          fi
