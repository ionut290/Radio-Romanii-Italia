name: RDI - Diagnosi accesso musica Oracle

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rdi-music-path-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostica read-only sul server
        env:
          K: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          H: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf %s "$K" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_rdi
          printf '%s\n' "$H" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rdi ~/.ssh/known_hosts
          scp -q -i ~/.ssh/id_rdi -o BatchMode=yes -o StrictHostKeyChecking=yes \
              scripts/rdi_music_path_diagnose.py ubuntu@129.151.255.41:/tmp/rdi_music_path_diagnose.py
          ssh -i ~/.ssh/id_rdi -o BatchMode=yes -o StrictHostKeyChecking=yes \
              ubuntu@129.151.255.41 'python3 /tmp/rdi_music_path_diagnose.py; rm -f /tmp/rdi_music_path_diagnose.py'
