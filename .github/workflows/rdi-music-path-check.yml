name: RDI - Diagnosi accesso musica Oracle

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rdi-music-path-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnostica sola lettura
        env:
          K: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          H: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf %s "$K" | base64 -d > ~/.ssh/id_rdi
          printf '%s\n' "$H" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rdi ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rdi -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@129.151.255.41 "python3 -c 'import os,subprocess; p="/var/lib/docker/volumes/azuracast_station_data/_data/radio-romanii-italia/media"; print("PATH_EXISTS",os.path.isdir(p)); r=subprocess.run(["sudo","-n","find",p,"-type","f","-print0"],capture_output=True); print("FIND_EXIT",r.returncode); print("FIND_ERROR_TYPE", "path_missing" if b"No such file" in r.stderr else "sudo_or_other" if r.returncode else "none"); print("FIND_FILES",r.stdout.count(bytes([0]))); v=subprocess.run(["sudo","-n","docker","volume","inspect","azuracast_station_data"],capture_output=True); print("VOLUME_INSPECT_EXIT",v.returncode); print("VOLUME_MOUNT",(__import__("json").loads(v.stdout)[0].get("Mountpoint") if v.returncode==0 else "unavailable"))'"
