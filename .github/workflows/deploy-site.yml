name: Verificare sito RDI (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Preia codul
        uses: actions/checkout@v4
      - name: Verifica file fondamentali
        run: |
          set -euo pipefail
          test -s index.html
          test -s ghid.html
          test -s directory-manage.js
          test -s directory-feed.js
          echo "File RDI presenti. La pubblicazione è gestita da GitHub Pages (main / root)."
      - name: Verifica la sintassi dei componenti della mappa\n        run: |\n          node --check harta-atacurilor.js\n          python -m py_compile scripts/update_attack_candidates.py\n      - name: Verifica dati e schede del Ghid
        run: |
          set -euo pipefail
          node --test tests/directory-quality.test.mjs tests/directory-map.test.mjs tests/directory-enrichment.test.mjs tests/directory-data.test.mjs tests/youtube-spots.test.mjs tests/editorial-system.test.mjs tests/attack-map.test.mjs
