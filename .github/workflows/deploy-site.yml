name: Verificare sito RDI (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Preia codul
        uses: actions/checkout@v4
      - name: Verifica file fondamentali
        run: |
          set -euo pipefail
          test -s index.html
          test -s geopolitica.html
          test -s geopolitica.css
          test -s geopolitica.js
          test -s ghid.html
          test -s directory-manage.js
          test -s directory-feed.js
          echo "File RDI presenti. La pubblicazione è gestita da GitHub Pages (main / root)."
      - name: Verifica la sintassi dei componenti della mappa
        run: |
          node --check harta-atacurilor.js
          node --check geopolitica.js
          node --check youtube-tg-sera.js
          node --check rdi-featured-core.mjs
          node --check youtube-landscapes-core.mjs
          node --input-type=module --check < youtube-landscapes.js
          node --input-type=module --check < rdi-featured.js
          python -m py_compile scripts/update_attack_candidates.py scripts/update_geopolitica.py
      - name: Verifica dati e schede del Ghid
        run: |
          set -euo pipefail
          node --test tests/directory-quality.test.mjs tests/directory-map.test.mjs tests/directory-enrichment.test.mjs tests/directory-data.test.mjs tests/youtube-spots.test.mjs tests/youtube-camera-breaks.test.mjs tests/youtube-landscapes.test.mjs tests/editorial-system.test.mjs tests/attack-map.test.mjs tests/rdi-featured.test.mjs tests/rdi-responsive.test.mjs
