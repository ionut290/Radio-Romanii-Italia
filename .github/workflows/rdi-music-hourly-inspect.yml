name: RDI - Verifica capacità palinsesto per fasce AzuraCast

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rdi-music-hourly-inspect.yml', 'scripts/rdi_music_hourly_inspect.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Configura connessione SSH
        env:
          KEY: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf %s "$KEY" | tr -d '[:space:]' | base64 -d > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
      - name: Verifica timezone e regole senza modifica del palinsesto
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=ubuntu@129.151.255.41
          STAGE="/tmp/rdi-hourly-inspect-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "install -d -m 700 '$STAGE'"
          trap 'ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "sudo -n rm -rf -- '\''$STAGE'\''" || true' EXIT
          scp -q -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/rdi_music_hourly_inspect.py scripts/deploy-geopolitica-oracle.py scripts/rdi-geopolitica-auth.php "$REMOTE:$STAGE/"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "sudo -n python3 '$STAGE/rdi_music_hourly_inspect.py'"
