name: Actualizare automată evenimente diaspora
on:
  schedule:
    - cron: '0 3,4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diaspora-events
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifică ora locală din Italia
        id: italy_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Rome date +%H)" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Caută evenimente viitoare
        if: steps.italy_time.outputs.run == 'true'
        run: python scripts/update_events.py
      - name: Publică lista numai dacă s-a modificat
        if: steps.italy_time.outputs.run == 'true'
        run: |
          if ! git diff --quiet -- events-auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events-auto.json
            git commit -m "Actualizare automată evenimente diaspora"
            git push
          fi
