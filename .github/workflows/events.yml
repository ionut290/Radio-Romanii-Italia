name: Actualizare automată evenimente diaspora
on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diaspora-events
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Caută evenimente viitoare
        run: python scripts/update_events.py
      - name: Publică lista numai dacă s-a modificat
        run: |
          if ! git diff --quiet -- events-auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events-auto.json
            git commit -m "Actualizare automată evenimente diaspora"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              echo "Conflict temporar; încercarea $attempt/5"
              sleep $((attempt * 4))
            done
            echo "Publicarea evenimentelor a eșuat după 5 încercări." >&2
            exit 1
          fi
