name: Actualizare automată evenimente diaspora
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diaspora-events
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Caută evenimente viitoare
        run: python scripts/update_events.py
      - name: Publică lista numai dacă s-a modificat
        run: |
          if ! git diff --quiet -- events-auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events-auto.json
            git commit -m "Actualizare automată evenimente diaspora"
            git push
          fi
