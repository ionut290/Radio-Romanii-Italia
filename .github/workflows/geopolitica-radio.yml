name: RDI - Notiziario Geopolitica (trasmissione automatica)

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_geopolitica_bulletin.py"
      - "scripts/render_geopolitica_audio.py"
      - "scripts/deploy-geopolitica-oracle.py"
      - "scripts/rdi-geopolitica-auth.php"
      - "data/geopolitica-radio-verified.json"
      - "tests/test_geopolitica_bulletin.py"
      - ".github/workflows/geopolitica-radio.yml"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdi-geopolitica-audio-portable
  cancel-in-progress: true

jobs:
  create-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testa testi, fonti e lingue senza modificare la radio
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_geopolitica_bulletin.py scripts/render_geopolitica_audio.py scripts/deploy-geopolitica-oracle.py
          python -m unittest discover -s tests -p 'test_geopolitica_bulletin.py' -v
      - name: Prepara notiziario interamente in italiano
        id: draft
        shell: bash
        run: |
          set +e
          python scripts/build_geopolitica_bulletin.py --language it --output /tmp/rdi-geopolitica
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Nessuna notizia editoriale recente: non generiamo audio obsoleto.'
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Installa voce e codificatore MP3 portatile (senza sudo)
        if: steps.draft.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check "edge-tts>=7,<8" "imageio-ffmpeg>=0.5,<1" "mutagen>=1.47,<2"
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          exe=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([exe, "-hide_banner", "-version"], check=True)
          print("Codificatore audio disponibile:", exe)
          PY
      - name: Genera il file audio MP3 di anteprima
        if: steps.draft.outputs.ready == 'true'
        run: python scripts/render_geopolitica_audio.py --folder /tmp/rdi-geopolitica
      - name: Conserva MP3, testo e fonti per verifica
        if: steps.draft.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rdi-geopolitica-audio-it
          path: |
            /tmp/rdi-geopolitica/RDI-GEOPOLITICA-IT-*.mp3
            /tmp/rdi-geopolitica/bulletin.txt
            /tmp/rdi-geopolitica/manifest.json
            /tmp/rdi-geopolitica/tv-timing.json
          if-no-files-found: error
          retention-days: 3
      - name: Pubblica i tempi dei singoli articoli per YouTube (non va in onda finché l'MP3 non è su AzuraCast)
        if: steps.draft.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          edition=$(python -c 'import json;print(json.load(open("/tmp/rdi-geopolitica/tv-timing.json"))["edition_id"])')
          if ! [[ "$edition" =~ ^20[0-9]{6}-[0-9]{4}$ ]]; then
            echo 'Identificativo edizione non valido' >&2
            exit 1
          fi
          mkdir -p data/geopolitica-tv
          cp /tmp/rdi-geopolitica/tv-timing.json "data/geopolitica-tv/${edition}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/geopolitica-tv/${edition}.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RDI: sincronizzazione TV edizione Geopolitica ${edition}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then
              echo "Timeline pubblicata: ${edition}"
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 3))"
          done
          echo 'Impossibile pubblicare la sincronizzazione TV' >&2
          exit 1
      - name: Invia l'edizione nuova ad AzuraCast Oracle e aggiorna la playlist una volta ogni ora
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_B64" || { echo '::error::Manca la chiave SSH Oracle'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo '::error::Mancano le impronte SSH Oracle'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
          timeout 10 ssh-keygen -y -f "$HOME/.ssh/id_rdi" </dev/null >/dev/null 2>&1
          REMOTE="ubuntu@129.151.255.41"
          STAGE="/tmp/rdi-geopolitica-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$REMOTE" "install -d -m 700 '$STAGE'"
          cleanup() {
            ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
              "$REMOTE" "sudo -n rm -rf -- '$STAGE'" || true
          }
          trap cleanup EXIT
          scp -q -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/deploy-geopolitica-oracle.py scripts/rdi-geopolitica-auth.php "$REMOTE:$STAGE/"
          if [ "${{ steps.draft.outputs.ready }}" = "true" ]; then
            edition=$(python -c 'import json;print(json.load(open("/tmp/rdi-geopolitica/manifest.json"))["edition_id"])')
            [[ "$edition" =~ ^20[0-9]{6}-[0-9]{4}$ ]] || { echo '::error::Edizione non valida'; exit 1; }
            mp3="/tmp/rdi-geopolitica/RDI-GEOPOLITICA-IT-${edition}.mp3"
            test -s "$mp3"
            scp -q -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$mp3" /tmp/rdi-geopolitica/manifest.json "$REMOTE:$STAGE/"
            ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
              "$REMOTE" "sudo -n python3 '$STAGE/deploy-geopolitica-oracle.py' apply --mp3 '$STAGE/RDI-GEOPOLITICA-IT-${edition}.mp3' --manifest '$STAGE/manifest.json' --php-helper '$STAGE/rdi-geopolitica-auth.php'"
            echo "Notiziario italiano ${edition} consegnato ad AzuraCast per la prossima fascia oraria."
          else
            ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
              "$REMOTE" "sudo -n python3 '$STAGE/deploy-geopolitica-oracle.py' suspend --php-helper '$STAGE/rdi-geopolitica-auth.php'"
            echo "Nessuna notizia recente: la playlist RDI Geopolitica resta sospesa."
          fi
