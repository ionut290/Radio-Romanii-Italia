name: RDI AI MUSIC API tests
on:
  push:
    paths:
      - 'rdi-ai-music-api/**'
      - '.github/workflows/rdi-ai-music-tests.yml'
  pull_request:
    paths:
      - 'rdi-ai-music-api/**'
      - '.github/workflows/rdi-ai-music-tests.yml'
permissions:
  contents: read
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'flask>=3,<4'
      - name: Test in temporary isolated database
        working-directory: rdi-ai-music-api
        run: python -m unittest discover -s . -p 'test_*.py' -v
