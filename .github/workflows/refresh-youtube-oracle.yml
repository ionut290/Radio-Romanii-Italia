name: RDI - Ricarica pagina YouTube su Oracle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['youtube-news.html', 'youtube-spots*.js', 'youtube-spots.css', 'data/spot-campaigns.json', 'spot-images/**', 'youtube-extras.js', 'data/romanians-italy.json']

permissions:
  contents: read

concurrency:
  group: rdi-youtube-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preia pagina aggiornata
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: Attendi la pubblicazione prima di ricaricare YouTube
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            ready=true
            for file in youtube-news.html youtube-spots.js youtube-spots-core.js youtube-spots.css data/spot-campaigns.json youtube-extras.js data/romanians-italy.json; do
              expected=$(sha256sum "$file" | cut -d ' ' -f 1)
              if ! curl --fail --silent --show-error --max-time 5 \
                "https://radioromanii.duckdns.org/${file}?v=${GITHUB_SHA}" \
                -o /tmp/rdi-youtube-published; then ready=false; break; fi
              actual=$(sha256sum /tmp/rdi-youtube-published | cut -d ' ' -f 1)
              if [ "$actual" != "$expected" ]; then ready=false; break; fi
            done
            if [ "$ready" = true ]; then exit 0; fi
            sleep 5
          done
          echo '::error::La nuova pagina YouTube non è ancora pubblicata; ricarica annullata.'
          exit 1
      - name: Verifica configurazione SSH
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_B64" || { echo "::error::Manca RDI_ORACLE_SSH_KEY_B64"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Manca RDI_ORACLE_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          # Rimuove solo gli spazi e gli a capo estranei, non modifica i byte decodificati.
          if ! printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"; then
            echo '::error::RDI_ORACLE_SSH_KEY_B64 non contiene Base64 valido. Ricrea il secret dal file originale usando PowerShell.'
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
          # Non stampa mai il contenuto della chiave e non richiede input interattivo.
          if ! timeout 12 ssh-keygen -y -f "$HOME/.ssh/id_rdi" </dev/null >/dev/null 2>&1; then
            echo '::error::La chiave privata decodificata non è leggibile da OpenSSH Linux o è protetta da passphrase.'
            exit 1
          fi
      - name: Ricarica Chromium senza riavviare la diretta
        run: |
          ssh -i "$HOME/.ssh/id_rdi" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=12 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            ubuntu@129.151.255.41 \
            'env DISPLAY=:92 XAUTHORITY=/home/ubuntu/.Xauthority bash -c '\''set -e; before=$(pgrep -x ffmpeg | sort); test -n "$before"; command -v xdotool >/dev/null; xdotool key --clearmodifiers ctrl+r; sleep 2; xdotool mousemove --sync 1 1; after=$(pgrep -x ffmpeg | sort); test "$before" = "$after"; echo "Pagina ricaricata; processi FFmpeg invariati."'\'''
      - name: Conferma
        run: echo "Comando di ricarica inviato. Controllare la diretta YouTube per verificare il risultato."
