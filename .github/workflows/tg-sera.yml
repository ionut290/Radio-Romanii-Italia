name: RDI - TG delle 18 con video autorizzati (produzione e radio)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_daily_tg.py'
      - 'scripts/tg_video_rights.py'
      - 'scripts/discover_tg_article_videos.py'
      - 'tests/test_tg_video_discovery.py'
      - 'data/tg-video-licenses.json'
      - 'data/youtube-landscapes.json'
      - 'tests/test_tg_video_rights.py'
      - 'scripts/render_daily_tg_audio.py'
      - 'scripts/deploy-tg-sera-oracle.py'
      - 'tests/test_deploy_tg_oracle.py'
      - 'tests/test_daily_tg.py'
      - '.github/workflows/tg-sera.yml'
  schedule:
    # Both UTC variants; Europe/Rome gate below handles daylight saving.
    - cron: '20 14,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdi-daily-evening-tg
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica sintassi, orario Italia, selezione notizie e diritti immagini
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_daily_tg.py scripts/tg_video_rights.py scripts/render_daily_tg_audio.py scripts/deploy-tg-sera-oracle.py
          python -m unittest discover -s tests -p 'test_deploy_tg_oracle.py' -v
          python -m unittest discover -s tests -p 'test_tg_video_rights.py' -v
          python -m unittest discover -s tests -p 'test_tg_video_discovery.py' -v
          python -m unittest discover -s tests -p 'test_daily_tg.py' -v
      - name: Verifica disponibilità delle credenziali editoriali senza rivelarle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "RDI_TG_EDITORIAL_KEY_CONFIGURED=true"
          else
            echo "RDI_TG_EDITORIAL_KEY_CONFIGURED=false"
            echo "::warning::Manca OPENAI_API_KEY: la redazione del TG sarà saltata finché non viene configurata."
          fi
      - name: Seleziona notizie approfondite pubblicate entro le 16
        run: python scripts/build_daily_tg.py --preview --output /tmp/rdi-tg-sera
      - name: Individua eventuali video degli articoli, solo per verifica licenze
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python scripts/discover_tg_article_videos.py --preview /tmp/rdi-tg-sera/source-preview.json --output /tmp/rdi-tg-sera/publisher-video-candidates.json
      - name: Conserva video candidati NON autorizzati per revisione
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rdi-tg-sera-video-da-verificare
          path: /tmp/rdi-tg-sera/publisher-video-candidates.json
          retention-days: 7
          if-no-files-found: error
      - name: Conserva lista fonti per la redazione
        uses: actions/upload-artifact@v4
        with:
          name: rdi-tg-sera-fonti
          path: /tmp/rdi-tg-sera/source-preview.json
          retention-days: 7
      - name: Verifica che l'orario locale sia 16:20
        id: window
        shell: bash
        run: |
          set -euo pipefail
          current="$(TZ=Europe/Rome date +%H)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$current" = "16" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "TG programmato per l'edizione delle 18:00 (fuso Europe/Rome)."
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "Solo anteprima/test: nessuna produzione automatica fuori dalla finestra delle 16."
          fi
      - name: Redigi TG italiano con approfondimenti e fonti verificabili
        id: draft
        if: steps.window.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set +e
          python scripts/build_daily_tg.py --output /tmp/rdi-tg-sera
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Non ci sono abbastanza notizie adeguatamente documentate: niente TG inventato."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Installa voce sintetica e FFmpeg
        if: steps.draft.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check "edge-tts>=7,<8" "imageio-ffmpeg>=0.5,<1" "mutagen>=1.47,<2"
      - name: Prepara voce femminile e cronologia delle scene video
        if: steps.draft.outputs.ready == 'true'
        run: python scripts/render_daily_tg_audio.py --folder /tmp/rdi-tg-sera
      - name: Archivia MP3, testo giornalistico, fonti e scene
        if: steps.draft.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rdi-tg-sera-edizione-italiana
          path: |
            /tmp/rdi-tg-sera/RDI-TG-SERA-IT-*.mp3
            /tmp/rdi-tg-sera/manifest.json
            /tmp/rdi-tg-sera/tg-script.txt
            /tmp/rdi-tg-sera/tv-timing.json
          retention-days: 7
          if-no-files-found: error
      - name: Pubblica la cronologia TV nel sito PRIMA dell'invio audio
        if: steps.draft.outputs.ready == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          edition="$(python -c 'import json; print(json.load(open("/tmp/rdi-tg-sera/manifest.json"))["edition_id"])')"
          [[ "$edition" =~ ^20[0-9]{6}$ ]] || { echo "::error::Edizione TG non valida"; exit 1; }
          install -d data/tg-sera
          cp /tmp/rdi-tg-sera/tv-timing.json "data/tg-sera/${edition}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/tg-sera/${edition}.json"
          if ! git diff --cached --quiet; then
            git commit -m "RDI: cronologia TV TG sera ${edition} (video autorizzati)"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then echo "::error::Non è stato possibile pubblicare la timeline TV"; exit 1; fi
              sleep "$((attempt * 3))"
            done
          fi
          echo "TIMELINE_GITHUB=${edition}.json"

      - name: Verifica che la cronologia TV sia effettivamente online
        if: steps.draft.outputs.ready == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          edition="$(python -c 'import json; print(json.load(open("/tmp/rdi-tg-sera/manifest.json"))["edition_id"])')"
          expected="$(sha256sum /tmp/rdi-tg-sera/tv-timing.json | cut -d ' ' -f 1)"
          for attempt in {1..45}; do
            if curl --fail --silent --show-error --max-time 12 \
              "https://radioromanii.duckdns.org/data/tg-sera/${edition}.json?check=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/rdi-tg-tv-live.json; then
              actual="$(sha256sum /tmp/rdi-tg-tv-live.json | cut -d ' ' -f 1)"
              if [ "$actual" = "$expected" ]; then
                echo "VIDEO_TIMING_PUBLICATION=VERIFIED"
                exit 0
              fi
            fi
            sleep 8
          done
          echo "::error::La cronologia TV non è accessibile: niente TG in onda per evitare immagini desincronizzate."
          exit 1

      - name: Trasferisci SOLO il TG del giorno ad AzuraCast Oracle alle ore 18
        if: steps.draft.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_B64" || { echo "::error::Manca la chiave Oracle"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Mancano le impronte Oracle"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
          timeout 12 ssh-keygen -y -f "$HOME/.ssh/id_rdi" </dev/null >/dev/null 2>&1
          REMOTE="ubuntu@129.151.255.41"
          STAGE="/tmp/rdi-tg-sera-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$REMOTE" "install -d -m 700 '$STAGE'"
          cleanup() {
            ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
              "$REMOTE" "sudo -n rm -rf -- '$STAGE'" || true
          }
          trap cleanup EXIT
          edition="$(python -c 'import json; print(json.load(open("/tmp/rdi-tg-sera/manifest.json"))["edition_id"])')"
          [[ "$edition" =~ ^20[0-9]{6}$ ]] || { echo "::error::Edizione non valida"; exit 1; }
          mp3="/tmp/rdi-tg-sera/RDI-TG-SERA-IT-${edition}.mp3"
          test -s "$mp3"
          scp -q -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/deploy-tg-sera-oracle.py scripts/deploy-geopolitica-oracle.py \
            scripts/rdi-geopolitica-auth.php \
            "$mp3" /tmp/rdi-tg-sera/manifest.json /tmp/rdi-tg-sera/tv-timing.json \
            "$REMOTE:$STAGE/"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$REMOTE" \
            "sudo -n python3 '$STAGE/deploy-tg-sera-oracle.py' apply --manifest '$STAGE/manifest.json' --mp3 '$STAGE/RDI-TG-SERA-IT-${edition}.mp3' --tv '$STAGE/tv-timing.json' --php-helper '$STAGE/rdi-geopolitica-auth.php'"
          echo "TG programmato in una playlist esclusiva e datata alle 18:00 ora italiana."
          echo "Avvio effettivo soggetto ai tempi di commutazione AutoDJ; la grafica segue il now-playing reale."

      - name: Nessuna vecchia puntata quando mancano notizie verificabili
        if: steps.window.outputs.run == 'true' && steps.draft.outputs.ready != 'true'
        run: |
          echo "Nessun TG pubblicato: la playlist è limitata alla data della propria edizione e non potrà ripetere la puntata precedente."
