name: RDI - Pensiero originale del giorno

on:
  # GitHub usa UTC: 23:00/23:25 in ora legale, 00:00/00:25 in ora solare.
  # Il controllo Europe/Rome qui sotto esegue solo all'01 locale.
  schedule:
    - cron: '0,25 23 * * *'
    - cron: '0,25 0 * * *'
  # Esegue una verifica/generazione subito quando si aggiorna questo workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-thought.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdi-daily-thought
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Esegui solo all'una italiana per gli avvii programmati
        id: ora
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Rome date +%H)
          echo "Ora italiana: $(TZ=Europe/Rome date '+%F %T %Z')"
          if [ "$HOUR" = 01 ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Questo UTC non corrisponde all'01 italiana; ignoro il passaggio."
          fi
      - uses: actions/checkout@v4
        if: steps.ora.outputs.execute == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.ora.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Prepara la fototeca realistica RDI
        if: steps.ora.outputs.execute == 'true'
        run: python -m pip install --disable-pip-version-check 'pillow>=10,<13'
      - name: Verifica fotografia reale senza chiavi API
        if: steps.ora.outputs.execute == 'true'
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          from scripts.generate_daily_thought import planned_thought, curated_photo
          day = dt.date(2026, 11, 1)
          thought = planned_thought(day)
          assert thought and len(thought["quote"]) > 12
          archive = json.loads(Path("data/daily-thought.json").read_text())
          picture, source = curated_photo(day, thought["quote"], archive.get("items", []))
          assert picture[:3] == bytes.fromhex("ffd8ff") and len(picture) > 10000, source
          print("RDI: fotografia gratuita automatica verificata:", source)
          PY
      - name: Crea il pensiero e la card grafica
        if: steps.ora.outputs.execute == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_THOUGHT_MODEL: gpt-4.1-mini
        run: python scripts/generate_daily_thought.py
      - name: Pubblica il contenuto del giorno
        if: steps.ora.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/daily-thought.json data/calendario-filosofico-oggi.json editorial-images/daily-thought/)" ]; then
            echo "Il pensiero di oggi è già pubblicato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/daily-thought.json data/calendario-filosofico-oggi.json editorial-images/daily-thought/
          git commit -m "RDI: pubblica il pensiero del giorno"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then
              echo "Pensiero e immagine pubblicati."
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 3))"
          done
          echo "::error::Il pensiero è stato generato ma non è stato possibile pubblicarlo."
          exit 1
