name: RDI - Pensiero originale del giorno

on:
  # Esegue subito anche quando viene modificata questa pianificazione.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-thought.yml'
  # Pubblicazione autonoma alle 01:30 italiane e recupero alle 06:30.
  # Entrambe le fasce gestiscono automaticamente ora solare/legale.
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdi-daily-thought
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verifica l'orario di controllo italiano
        id: ora
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Rome date +%H)
          echo "Ora italiana: $(TZ=Europe/Rome date '+%F %T %Z')"
          if [ "$HOUR" = 01 ] || [ "$HOUR" = 06 ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Questo UTC non corrisponde alle 01 o alle 06 italiane; ignoro il passaggio."
          fi
      - uses: actions/checkout@v4
        if: steps.ora.outputs.execute == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.ora.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Prepara la fototeca realistica RDI
        if: steps.ora.outputs.execute == 'true'
        run: python -m pip install --disable-pip-version-check 'pillow>=10,<13'
      - name: Genera il pensiero quotidiano se manca
        if: steps.ora.outputs.execute == 'true'
        env:
          # Usa solo la fototeca RDI già autorizzata, dichiarandola sempre come
          # composizione d'archivio: nessun servizio a pagamento e nessuna foto
          # viene presentata come uno scatto nuovo del giorno.
          RDI_ALLOW_ARCHIVE_PHOTO: '1'
          RDI_THOUGHT_USE_AI_IMAGES: '0'
        run: python scripts/generate_daily_thought.py
      - name: Pubblica il contenuto del giorno
        if: steps.ora.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/daily-thought.json data/calendario-filosofico-oggi.json editorial-images/daily-thought/)" ]; then
            echo "Il pensiero di oggi è già pubblicato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/daily-thought.json data/calendario-filosofico-oggi.json editorial-images/daily-thought/
          git commit -m "RDI: pubblica il pensiero del giorno"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then
              echo "Pensiero e immagine pubblicati."
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 3))"
          done
          echo "::error::Il pensiero è stato generato ma non è stato possibile pubblicarlo."
          exit 1
      - name: Aggiorna il watchdog Oracle del Pensiero
        if: steps.ora.outputs.execute == 'true'
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
          REMOTE=ubuntu@129.151.255.41
          STAGE=/tmp/rdi-daily-thought-watchdog-${GITHUB_RUN_ID}
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "install -d -m 700 '$STAGE'"
          trap 'ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "rm -rf -- '\''$STAGE'\''" || true' EXIT
          scp -q -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes oracle/rdi-daily-thought-watchdog.py oracle/rdi-daily-thought-watchdog.service oracle/rdi-daily-thought-watchdog.timer "$REMOTE:$STAGE/"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "sudo -n env STAGE='$STAGE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          install -d -m 755 /opt/rdi-daily-thought-watchdog
          install -m 755 "$STAGE/rdi-daily-thought-watchdog.py" /opt/rdi-daily-thought-watchdog/rdi-daily-thought-watchdog.py
          install -m 644 "$STAGE/rdi-daily-thought-watchdog.service" /etc/systemd/system/rdi-daily-thought-watchdog.service
          install -m 644 "$STAGE/rdi-daily-thought-watchdog.timer" /etc/systemd/system/rdi-daily-thought-watchdog.timer
          install -d -m 750 -o ubuntu -g ubuntu /home/ubuntu/.local/state/rdi-daily-thought-watchdog
          systemctl daemon-reload
          systemctl enable --now rdi-daily-thought-watchdog.timer
          systemctl start rdi-daily-thought-watchdog.service
          systemctl is-active --quiet rdi-daily-thought-watchdog.timer
          REMOTE_SCRIPT
