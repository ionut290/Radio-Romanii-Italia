name: RDI - Pensiero originale del giorno

on:
  # Il vero scatto si genera nella Task ChatGPT esistente delle 01:00 italiane.
  # GitHub verifica alle 02:30 Europe/Rome, gestendo automaticamente l'ora legale.
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdi-daily-thought
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verifica l'orario di controllo italiano
        id: ora
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Rome date +%H)
          echo "Ora italiana: $(TZ=Europe/Rome date '+%F %T %Z')"
          if [ "$HOUR" = 02 ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Questo UTC non corrisponde alle 02 italiane; ignoro il passaggio."
          fi
      - uses: actions/checkout@v4
        if: steps.ora.outputs.execute == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.ora.outputs.execute == 'true'
        with:
          python-version: '3.12'
      - name: Verifica scatto indipendente pubblicato da ChatGPT
        if: github.event_name == 'schedule' && steps.ora.outputs.execute == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today=dt.datetime.now(ZoneInfo("Europe/Rome")).date().isoformat()
          data=json.loads(Path("data/daily-thought.json").read_text(encoding="utf-8"))
          entry=next((x for x in data.get("items",[]) if x.get("date")==today),None)
          assert entry, "Nessun pensiero del giorno creato da ChatGPT"
          assert entry.get("imageType")=="photorealistic-ai-generated" and not entry.get("photo_source"), "La foto non risulta uno scatto IA indipendente"
          path=Path(str(entry.get("image","")).removeprefix("./").lstrip("/"))
          assert str(path).startswith("editorial-images/daily-thought/"), "Percorso immagine imprevisto"
          assert path.is_file() and path.stat().st_size>10000, "File immagine originale assente"
          assert path.read_bytes()[:3]==bytes.fromhex("ffd8ff"), "Il file non e' un JPEG valido"
          pointer=json.loads(Path("data/calendario-filosofico-oggi.json").read_text(encoding="utf-8"))
          assert pointer.get("date")==today and pointer.get("image")=="/"+path.as_posix(), "Puntatore del calendario non aggiornato"
          print("RDI: scatto indipendente del giorno verificato",today,path)
          PY
      - name: Prepara la fototeca realistica RDI
        if: github.event_name == 'workflow_dispatch' && steps.ora.outputs.execute == 'true'
        run: python -m pip install --disable-pip-version-check 'pillow>=10,<13'
      - name: Crea il pensiero e la card grafica
        if: github.event_name == 'workflow_dispatch' && steps.ora.outputs.execute == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_THOUGHT_MODEL: gpt-4.1-mini
        run: python scripts/generate_daily_thought.py
      - name: Pubblica il contenuto del giorno
        if: github.event_name == 'workflow_dispatch' && steps.ora.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/daily-thought.json data/calendario-filosofico-oggi.json editorial-images/daily-thought/)" ]; then
            echo "Il pensiero di oggi è già pubblicato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/daily-thought.json data/calendario-filosofico-oggi.json editorial-images/daily-thought/
          git commit -m "RDI: pubblica il pensiero del giorno"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then
              echo "Pensiero e immagine pubblicati."
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 3))"
          done
          echo "::error::Il pensiero è stato generato ma non è stato possibile pubblicarlo."
          exit 1
