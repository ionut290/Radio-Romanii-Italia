name: Traduzioni notizie RDI
on:
  push:
    branches: [main]
    paths:
      - 'news.json'
      - 'editorial.json'
      - 'scripts/translate_news.py'
      - '.github/workflows/translate-news.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rdi-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate recent news
        run: python scripts/translate_news.py
      - name: Store translations
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- news-translations.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-translations.json
          git commit -m "Aggiorna traduzioni RO IT"
          for attempt in 1 2 3 4; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
