name: Actualizare știri radio
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/news.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-news-update
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preia știrile
        run: python scripts/update_news.py
      - name: Publică actualizarea
        run: |
          if [ -n "$(git status --porcelain -- news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "Actualizare automată știri"
            git push
          fi
