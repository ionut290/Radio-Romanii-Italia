name: Actualizare știri radio
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/news_illustrations.py'
      - 'scripts/news_details.py'
      - 'scripts/build_editorial_status.py'
      - 'data/news-summaries.json'
      - '.github/workflows/news.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-news-update
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preia știrile
        timeout-minutes: 9
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_news.py; then
              exit 0
            fi
            echo "Încercarea $attempt de preluare a știrilor a eșuat."
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verifică prospețimea fișierului
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          data=json.loads(Path('news.json').read_text(encoding='utf-8'))
          updated=dt.datetime.fromisoformat(data['updated_at'].replace('Z','+00:00'))
          age=(dt.datetime.now(dt.timezone.utc)-updated).total_seconds()/60
          print(f'Ultima actualizare news.json: {age:.0f} minute în urmă')
          if age>90:
              raise SystemExit('Actualizarea știrilor este prea veche; verifică sursele RSS și execuția automată.')
          PY
      - name: Calculează starea redacției
        run: python scripts/build_editorial_status.py
      - name: Publică actualizarea
        run: |
          if [ -n "$(git status --porcelain -- news.json editorial-images/ data/editorial-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A news.json editorial-images/ data/editorial-status.json
            git commit -m "Actualizare automată știri"
            for attempt in 1 2 3 4 5; do
              if git -c merge.renames=false pull --rebase -X ours origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo "Publicarea știrilor a eșuat după 5 încercări." >&2
            exit 1
          fi
