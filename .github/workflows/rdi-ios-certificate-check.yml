name: RDI iOS - Diagnostica certificato (senza upload)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-p12:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      P12_B64: ${{ secrets.RDI_IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.RDI_IOS_P12_PASSWORD }}
    steps:
      - name: Controlla disponibilità segreti
        shell: bash
        run: |
          set -euo pipefail
          test -n "$P12_B64" || { echo "::error::RDI_IOS_P12_BASE64 mancante"; exit 1; }
          test -n "$P12_PASSWORD" || { echo "::error::RDI_IOS_P12_PASSWORD mancante"; exit 1; }
      - name: Decodifica e verifica integrità PKCS12
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/rdi.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/rdi.p12" -info -noout -passin env:P12_PASSWORD > "$RUNNER_TEMP/openssl-check.log" 2>&1; then
            echo "::error::PKCS12 non leggibile con la password GitHub o formato incompatibile. Verifica password e contenuto Base64."
            exit 1
          fi
          echo "OK: PKCS12 leggibile con password GitHub"
      - name: Ricrea P12 compatibile con macOS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl pkcs12 -in "$RUNNER_TEMP/rdi.p12" -nodes -passin env:P12_PASSWORD -out "$RUNNER_TEMP/rdi-identity.pem"
          TEMP_IMPORT_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TEMP_IMPORT_PASSWORD"
          openssl pkcs12 -export -in "$RUNNER_TEMP/rdi-identity.pem" -out "$RUNNER_TEMP/rdi-modern.p12" -passout "pass:$TEMP_IMPORT_PASSWORD" -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg sha256
          echo "TEMP_IMPORT_PASSWORD=$TEMP_IMPORT_PASSWORD" >> "$GITHUB_ENV"
          echo "OK: P12 ricreato con AES-256/SHA-256"
      - name: Prova importazione nel portachiavi macOS
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/rdi-test.keychain-db"
          KEYCHAIN_PASSWORD="$TEMP_IMPORT_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/rdi-modern.p12" -k "$KEYCHAIN" -P "$TEMP_IMPORT_PASSWORD" -T /usr/bin/codesign > "$RUNNER_TEMP/security-import.log" 2>&1; then
            echo "::error::Importazione macOS fallita. Diagnostica del comando security:"
            grep -E "security:|SecKeychain|Error|error|MAC verification|Unknown|invalid|unsupported" "$RUNNER_TEMP/security-import.log" | head -n 8 || echo "Nessun dettaglio diagnostico disponibile"
            exit 1
          fi
          echo "OK: certificato importabile in macOS"
      - name: Pulisci file temporanei
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rdi.p12" "$RUNNER_TEMP/rdi-modern.p12" "$RUNNER_TEMP/rdi-identity.pem" "$RUNNER_TEMP/openssl-check.log" "$RUNNER_TEMP/security-import.log"
          security delete-keychain "$RUNNER_TEMP/rdi-test.keychain-db" 2>/dev/null || true
