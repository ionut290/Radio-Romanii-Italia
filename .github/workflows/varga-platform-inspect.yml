# Updated for current read-only Oracle inspection (2026-10-28)
name: Varga platforms - ricognizione container in sola lettura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/varga-platform-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configura accesso Oracle
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_B64"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
      - name: Legge stato dei soli container Varga
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 ubuntu@129.151.255.41 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '--- Container Varga Cantieri e Varga Gestionale (stato, healthcheck, restart policy, servizio compose, porte) ---'
          sudo -n docker ps -a --format '{{.Names}}' | grep -E '^(varga-cantieri|vg-gestionale-oracle|varga-gestionale-oracle)' | while IFS= read -r name; do
            sudo -n docker inspect --format='name={{.Name}} | image={{.Config.Image}} | state={{.State.Status}} | health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}} | restart={{.HostConfig.RestartPolicy.Name}} | compose_project={{index .Config.Labels "com.docker.compose.project"}} | compose_service={{index .Config.Labels "com.docker.compose.service"}} | ports={{json .NetworkSettings.Ports}} | healthcheck={{json .Config.Healthcheck}}' "$name"
          done
          echo '--- Servizi del bot Varga ---'
          systemctl is-active varga-platform-bot.timer || true
          systemctl is-active varga-platform-dashboard.service || true
          systemctl show varga-platform-bot.service -p Result -p ExecMainStatus -p ExecMainStartTimestamp --no-pager || true
          systemctl list-timers --all --no-pager varga-platform-bot.timer || true
          journalctl -u varga-platform-bot.service -n 12 --no-pager || true
          echo '--- Dashboard locale Oracle ---'
          curl --fail --silent --show-error --max-time 8 http://127.0.0.1:8790/api/status | python3 -c 'import json,sys; d=json.load(sys.stdin); print("overall="+str(d.get("overall"))); print("checked_at="+str(d.get("checked_at"))); print("actions="+json.dumps(d.get("actions",[]),ensure_ascii=False)); [print(p["label"]+": "+p["state"]+"; "+", ".join(k+"="+v["state"] for k,v in p["services"].items())) for p in d.get("platforms",{}).values()]' || true
          echo '--- Database Varga Cantieri (stato e probe read-only) ---'
          sudo -n docker inspect db-postgres-1 --format='state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}} restart={{.HostConfig.RestartPolicy.Name}} compose_project={{index .Config.Labels "com.docker.compose.project"}} compose_service={{index .Config.Labels "com.docker.compose.service"}}' || true
          sudo -n docker exec db-postgres-1 pg_isready -U varga -d varga_cantieri || true
          echo '--- Route GET salute/status API Cantieri (solo nomi percorso) ---'
          python3 - <<'PY'
          from pathlib import Path
          import re
          try:
              p=Path('/home/ubuntu/varga-cantieri/api/server.cjs')
              if not p.exists():
                  print('source_not_found')
              else:
                  found=[]
                  for line in p.read_text(errors='replace').splitlines():
                      lower=line.lower()
                      if not re.search(r'\.(?:get|head)\s*\(', line, re.I):
                          continue
                      if not any(term in lower for term in ('health','ready','live','status','ping')):
                          continue
                      tail=line.split('(',1)[1].lstrip()
                      if tail[:1] in ("'", '"', '\x60'):
                          route=tail[1:].split(tail[0],1)[0]
                          found.append(route)
                  print('\n'.join(sorted(set(found))) or 'no_explicit_health_route_found')
          except Exception as exc:
              print('route_scan_error='+type(exc).__name__)
          PY
          echo '--- Probe GET API Gestione ale (solo codice HTTP) ---'
          curl -sS -o /dev/null --max-time 5 -w 'gestionale_api_health_http=%{http_code}\\n' http://127.0.0.1:18098/api/gestionale/v1/health || true
          echo '--- Ascolto locale porta 8790 ---'
          ss -lnt | grep -F '127.0.0.1:8790' || true
          REMOTE
