name: Geopolitica photographic WebP covers
on:
  push:
    branches: [main]
    paths:
      - scripts/build_geopolitica_photos.py
      - .github/workflows/geopolitica-category-images.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geopolitica-photographic-covers
  cancel-in-progress: false
jobs:
  build-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install 'Pillow>=11,<13'
      - name: Download freely licensed editorial photographs and create WebP
        run: python -u scripts/build_geopolitica_photos.py
      - name: Validate 80 images and photo attribution
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('data/geopolitica-images/categories')
          names=('diplomatie','conflicte','europa','economie','energie','securitate','tehnologie','clima')
          credit=json.loads((root/'PHOTO-CREDITS.json').read_text())
          for name in names:
              paths=sorted((root/name).glob('*.webp'))
              assert [p.name for p in paths]==[f'{i:02}.webp' for i in range(1,11)],name
              for p in paths:
                  with Image.open(p) as im:
                      assert im.format=='WEBP' and min(im.size)>=300
              if name!='diplomatie':
                  assert len(credit['categories'][name])==10
              print(name,len(paths))
          PY
      - name: Commit only geopolitics photo thumbnails and credit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geopolitica-images/categories/conflicte/ data/geopolitica-images/categories/europa/ data/geopolitica-images/categories/economie/ data/geopolitica-images/categories/energie/ data/geopolitica-images/categories/securitate/ data/geopolitica-images/categories/tehnologie/ data/geopolitica-images/categories/clima/ data/geopolitica-images/categories/PHOTO-CREDITS.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace geometric Geopolitica covers with credited editorial photographs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
