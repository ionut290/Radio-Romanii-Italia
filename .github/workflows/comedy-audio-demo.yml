name: RDI - Prova audio comica Pronto RDI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_comedy_audio_demo.py'
      - '.github/workflows/comedy-audio-demo.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa voce RDI e strumenti audio
        run: |
          python -m pip install --disable-pip-version-check "edge-tts>=7,<8" "imageio-ffmpeg>=0.5,<1" "mutagen>=1.47,<2"
      - name: Genera la telefonata comica dimostrativa
        run: python scripts/render_comedy_audio_demo.py
      - name: Verifica file MP3 e voci
        run: |
          test -s demo-output/RDI-Pronto-RDI-prova.mp3
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("demo-output/metadata.json").read_text())
          assert data["duration_seconds"] >= 60
          assert data["fiction_notice"].startswith("Telefonata simulata")
          assert data["host_voice"] == "it-IT-ElsaNeural"
          print("Prova pronta:",data["duration_seconds"],"secondi")
          PY
      - name: Conserva la prova, senza trasmetterla
        uses: actions/upload-artifact@v4
        with:
          name: RDI-Pronto-RDI-prova-audio
          path: |
            demo-output/RDI-Pronto-RDI-prova.mp3
            demo-output/metadata.json
          retention-days: 14
          if-no-files-found: error
