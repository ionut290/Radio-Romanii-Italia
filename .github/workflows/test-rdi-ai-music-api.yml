name: Test RDI AI MUSIC API

on:
  push:
    branches: [main]
    paths:
      - 'rdi-ai-music-api/**'
      - '.github/workflows/test-rdi-ai-music-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check submissions, permissions and rate limits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install 'Flask>=3,<4'
      - name: Check Python syntax
        run: python -m py_compile rdi-ai-music-api/app.py rdi-ai-music-api/test_app.py
      - name: Run backend unit tests
        working-directory: rdi-ai-music-api
        run: python -m unittest discover -s . -p 'test_*.py' -v
