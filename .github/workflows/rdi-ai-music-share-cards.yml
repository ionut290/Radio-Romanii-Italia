name: Update RDI AI Music social preview cards
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency:
  group: rdi-ai-music-social-cards
  cancel-in-progress: false
jobs:
  social-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Generate individual social cards
        run: python scripts/generate_ai_music_social_cards.py
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-music-share/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh RDI AI Music per-song share previews"
            git push
          fi
