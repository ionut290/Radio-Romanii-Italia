name: Verify Radio Românii iOS shell

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-radio-app-20261113]
    paths:
      - "mobile-ios/**"
      - ".github/workflows/verify-ios-radio-shell.yml"

permissions:
  contents: read

jobs:
  build-simulator:
    name: Build unsigned iPhone simulator app
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned native runtime
        run: npm install --no-audit --no-fund
      - name: Generate the native iOS project
        run: |
          set -euo pipefail
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          node scripts/configure-ios.mjs
          test -s ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/App/App/Info.plist | grep -Fx audio
      - name: Build without signing for iPhone Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
