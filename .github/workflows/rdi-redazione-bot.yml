name: RDI - Controllo redazione automatica

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica archivi e notizie radio disponibili
        run: python scripts/rdi_redazione_bot.py --output rdi-redazione-health.json
      - name: Diagnostica Oracle e AzuraCast (sola lettura)
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY_B64" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo '::error::Credenziali SSH Oracle non configurate per la diagnostica'
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
          timeout 8 ssh-keygen -y -f "$HOME/.ssh/id_rdi" </dev/null >/dev/null
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 ubuntu@129.151.255.41 'sudo -n bash -s' < scripts/inspect-geopolitica-oracle.sh > rdi-oracle-health.log
          cat rdi-oracle-health.log
      - name: Conserva diagnostica Oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdi-oracle-health
          path: rdi-oracle-health.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Conserva il rapporto anche in caso di anomalia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdi-redazione-health
          path: rdi-redazione-health.json
          if-no-files-found: warn
          retention-days: 7
