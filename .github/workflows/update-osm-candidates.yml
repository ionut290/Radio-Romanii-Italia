name: Aggiorna candidature OpenStreetMap

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import-osm-candidates.mjs
      - data/directory-public.json

permissions:
  contents: write

concurrency:
  group: osm-candidates
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cerca candidature OpenStreetMap
        run: node scripts/import-osm-candidates.mjs
      - name: Salva solo le candidature aggiornate
        run: |
          if git diff --quiet -- data/directory-osm-candidates.json; then
            echo "Nessuna modifica alle candidature."
            exit 0
          fi
          git config user.name "RDI directory bot"
          git config user.email "actions@github.com"
          git add data/directory-osm-candidates.json
          git commit -m "Aggiorna candidature OpenStreetMap"
          git push
