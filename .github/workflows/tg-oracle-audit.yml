name: RDI - Audit sicuro AzuraCast per TG 18

on:
  push:
    branches: [main]
    paths: ['scripts/inspect_tg_oracle.py', '.github/workflows/tg-oracle-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Controllo sintassi e accesso SSH senza segreti in output
        env:
          SSH_KEY_B64: ${{ secrets.RDI_ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.RDI_ORACLE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/inspect_tg_oracle.py scripts/deploy-geopolitica-oracle.py
          test -n "$SSH_KEY_B64"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf %s "$SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_rdi"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rdi" "$HOME/.ssh/known_hosts"
          timeout 10 ssh-keygen -y -f "$HOME/.ssh/id_rdi" </dev/null >/dev/null 2>&1
          STAGE="/tmp/rdi-tg-audit-${GITHUB_RUN_ID}"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@129.151.255.41 "install -d -m 700 '$STAGE'"
          trap 'ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@129.151.255.41 "sudo -n rm -rf -- '\''$STAGE'\''" || true' EXIT
          scp -q -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/deploy-geopolitica-oracle.py scripts/inspect_tg_oracle.py scripts/rdi-geopolitica-auth.php "ubuntu@129.151.255.41:$STAGE/"
          ssh -i "$HOME/.ssh/id_rdi" -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@129.151.255.41 \
            "sudo -n python3 '$STAGE/inspect_tg_oracle.py' --php-helper '$STAGE/rdi-geopolitica-auth.php'"
