name: RDI Web - Test stabilità player audio
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'spotlight-ai.html'
      - 'scripts/check_web_audio.py'
      - '.github/workflows/web-audio-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-web-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica la sintassi dei player e la gestione dei retry
        run: python3 scripts/check_web_audio.py
