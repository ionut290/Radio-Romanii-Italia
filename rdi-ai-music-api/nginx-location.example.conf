# Nginx: add this location INSIDE the EXISTING server { } that serves
# https://radioromanii.duckdns.org/ — do not replace the site config.
# Check with: sudo nginx -t && sudo systemctl reload nginx
# Requires RDI AI Music backend listening only on 127.0.0.1:8766.
# Set in the correct site block; preserve URI path using proxy_pass without trailing slash.
location ^~ /api/ai-music/ {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_read_timeout 100s;
    add_header X-Content-Type-Options nosniff always;
}
# Optional defense-in-depth for the editorial page: use an existing authenticated
# location or IP allowlist. The admin API itself requires a bearer token.
