</style></head><body><main>
<header><a href="./index.html">← Radio Românii din Italia</a><select id="lang" aria-label="Language"><option value="it">Italiano</option><option value="ro">Română</option><option value="en">English</option></select></header>
<section class="hero"><div class="hero-art" aria-hidden="true">🎧</div>
<h1>RDI AI MUSIC <span>Spotlight</span></h1><p class="lead" id="intro"></p>
<nav class="links"><a href="./artisti-ai.html" id="submitLink"></a><a href="./index.html" id="radioLink"></a><a href="./redactie-ai-music.html" class="admin-link" id="adminLink">🔐 Redazione</a></nav>
</section>

 <button id="play-all" type="button">▶ Play All</button>

<nav class="pager" aria-label="Pagine classifica"><button id="page-prev" type="button">← Precedente</button><span class="page-info" id="page-info">Pagina 1</span><button id="page-next" type="button">Successiva →</button></nav>
<footer>Radio Românii din Italia · RDI AI MUSIC Spotlight</footer>
</main><script>
"use strict";
const API="https://radio-romanii-italia.duckdns.org/api/ai-music";
const strings={
it:{intro:"Ascolta le canzoni AI selezionate dalla redazione, vota quelle che ami e scopri la classifica della community.",submit:"Proponi un brano",radio:"Ascolta la radio",notice:"In classifica compaiono solo brani approvati. Ogni browser può votare una volta per brano. I voti sono indicativi e soggetti a controlli anti-abuso. L'approvazione e i voti non garantiscono la messa in onda.",heading:"Classifica pubblica",songs:"brani",votes:"voti",vote:"Vota",voted:"Hai votato",listen:"Ascolta il brano",listenExternal:"Ascolta sulla piattaforma",noPreview:"Anteprima non disponibile: per i file audio serve il consenso dell'artista.",loading:"Caricamento classifica…",empty:"Non ci sono ancora brani approvati in classifica.",error:"Impossibile caricare la classifica. Riprova più tardi.",thanks:"Voto registrato!",duplicate:"Hai già votato questo brano.",limited:"Troppi voti da questa connessione. Riprova domani.",failed:"Voto non riuscito."},
ro:{intro:"Ascultă piesele AI aprobate de redacție, votează-ți preferatele și urmărește clasamentul comunității.",submit:"Trimite o piesă",radio:"Ascultă radioul",notice:"Apar doar piesele aprobate. Fiecare browser poate vota o singură dată pentru fiecare piesă. Voturile sunt orientative și sunt verificate împotriva abuzurilor. Voturile nu garantează difuzarea.",heading:"Clasament public",songs:"piese",votes:"voturi",vote:"Votează",voted:"Ai votat",listen:"Ascultă piesa",listenExternal:"Ascultă pe platformă",noPreview:"Previzualizare indisponibilă: pentru fișiere este necesar acordul artistului.",loading:"Se încarcă clasamentul…",empty:"Nu există încă piese aprobate în clasament.",error:"Clasamentul nu poate fi încărcat. Revino mai târziu.",thanks:"Votul a fost înregistrat!",duplicate:"Ai votat deja această piesă.",limited:"Prea multe voturi de la această conexiune. Revino mâine.",failed:"Vot nereușit."},
en:{intro:"Listen to AI songs approved by our editors, vote for your favorites and explore the community chart.",submit:"Submit a track",radio:"Listen to the radio",notice:"Only approved songs appear. Each browser can vote once per song. Votes are indicative and subject to abuse controls; votes do not guarantee airplay.",heading:"Public chart",songs:"tracks",votes:"votes",vote:"Vote",voted:"Voted",listen:"Listen to the track",listenExternal:"Listen on platform",noPreview:"No preview available: uploaded audio requires the artist's permission.",loading:"Loading chart…",empty:"No approved songs are in the chart yet.",error:"Unable to load the chart. Please retry later.",thanks:"Vote registered!",duplicate:"You already voted for this track.",limited:"Too many votes from this connection. Try tomorrow.",failed:"Vote failed."}
};
const $=id=>document.getElementById(id);
let language=localStorage.getItem("rdi-language")||"it";if(!strings[language])language="it";$("lang").value=language;
let page=1,total=0,totalPages=1,playQueue=[],playIndex=-1;
let allTracks=[],voted=new Set(JSON.parse(localStorage.getItem("rdi-spotlight-voted")||"[]"));
let visitor=localStorage.getItem("rdi-spotlight-visitor");
if(!visitor || !/^[0-9a-f-]{36}$/i.test(visitor)){visitor=crypto.randomUUID();localStorage.setItem("rdi-spotlight-visitor",visitor)}
function t(k){return strings[language][k]}
function translate(){document.documentElement.lang=language;
$("adminLink").textContent=({it:"🔐 Redazione",ro:"🔐 Redacție",en:"🔐 Editorial login"})[language];
$("page-prev").textContent=({it:"← Precedente",ro:"← Anterioară",en:"← Previous"})[language];
$("page-next").textContent=({it:"Successiva →",ro:"Următoarea →",en:"Next →"})[language];
$("play-all").textContent=({it:"▶ Play All",ro:"▶ Redă toate",en:"▶ Play All"})[language];
$("player-stop").textContent=({it:"■ Stop",ro:"■ Oprește",en:"■ Stop"})[language];
$("player-note").textContent=({it:"La riproduzione continua include solo i file audio autorizzati. I link esterni non sono riproducibili automaticamente.",ro:"Redarea continuă include doar fișierele audio autorizate. Linkurile externe nu pot fi redate automat.",en:"Continuous playback includes only approved and consented audio files. External music links cannot be autoplayed."})[language];
$("intro").textContent=t("intro");$("submitLink").textContent=t("submit");$("radioLink").textContent=t("radio");$("notice").textContent=t("notice");$("heading").textContent=t("heading");render()}
$("lang").onchange=()=>{language=$("lang").value;localStorage.setItem("rdi-language",language);translate()};
function node(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function safeLink(url){try{const u=new URL(url);return u.protocol==="https:"&&!u.username&&!u.password?u.href:null}catch{return null}}
let expandedTrackId=null;
const commentText={
 it:{show:"💬 Commenti",hide:"▲ Chiudi commenti",comments:"💬 Commenti della community",no:"Ancora nessun commento. Scrivi il primo!",name:"Il tuo nome",write:"Scrivi un commento…",send:"✉ Invia",sent:"Commento pubblicato!",slow:"Attendi almeno un minuto prima di scrivere di nuovo.",problem:"Commenti temporaneamente non disponibili.",limit:"Usa un nome da 2 a 40 caratteri e un commento da 3 a 500 caratteri."},
 ro:{show:"💬 Comentarii",hide:"▲ Închide comentariile",comments:"💬 Comentariile comunității",no:"Încă nu există comentarii. Scrie primul!",name:"Numele tău",write:"Scrie un comentariu…",send:"✉ Trimite",sent:"Comentariu publicat!",slow:"Așteaptă cel puțin un minut înainte de a comenta din nou.",problem:"Comentariile nu sunt disponibile momentan.",limit:"Numele trebuie să aibă 2-40 de caractere, iar comentariul 3-500."},
 en:{show:"💬 Comments",hide:"▲ Close comments",comments:"💬 Community comments",no:"No comments yet. Be the first!",name:"Your name",write:"Write a comment…",send:"✉ Send",sent:"Comment published!",slow:"Please wait at least one minute before commenting again.",problem:"Comments are temporarily unavailable.",limit:"Use a 2-40 character name and a 3-500 character comment."}
};
function ct(k){return commentText[language][k]}
async function showComments(track,panel){
 const list=panel.querySelector(".comment-list");
 list.replaceChildren();
 try{
  const response=await fetch(API+"/spotlight/"+encodeURIComponent(track.id)+"/comments",{cache:"no-store",credentials:"omit"});
  if(!response.ok)throw Error(String(response.status));
  const data=await response.json();
  if(!data.comments.length)list.append(node("p","hint",ct("no")));
  for(const item of data.comments){
   const line=node("div","comment-line");
   const name=node("strong","",item.nickname);
   const date=node("time","",new Date(item.created_at).toLocaleString(language,{dateStyle:"short",timeStyle:"short"}));
   line.append(name,date,node("p","",item.body));list.append(line);
  }
 }catch(e){list.append(node("p","hint",ct("problem")))}
}
function buildComments(track){
 const panel=node("section","comments-panel");panel.setAttribute("aria-label",ct("comments"));
 panel.append(node("div","comments-title",ct("comments")+" · "+track.title));
 const form=node("form","comment-form");
 const name=node("input");name.type="text";name.minLength=2;name.maxLength=40;name.required=true;name.placeholder=ct("name");name.setAttribute("aria-label",ct("name"));
 const body=node("textarea");body.minLength=3;body.maxLength=500;body.required=true;body.placeholder=ct("write");body.setAttribute("aria-label",ct("write"));
 const send=node("button","",ct("send"));send.type="submit";
 const feedback=node("div","comment-feedback");feedback.setAttribute("role","status");
 const list=node("div","comment-list");
 form.append(name,body,send);panel.append(form,feedback,list);
 form.onsubmit=async e=>{
  e.preventDefault();
  const nickname=name.value.trim(),message=body.value.trim();
  if(nickname.length<2||nickname.length>40||message.length<3||message.length>500){feedback.textContent=ct("limit");return}
  send.disabled=true;
  try{
   const res=await fetch(API+"/spotlight/"+encodeURIComponent(track.id)+"/comments",{
    method:"POST",headers:{"Content-Type":"application/json"},credentials:"omit",
    body:JSON.stringify({nickname,body:message})});
   if(res.status===201){body.value="";feedback.textContent=ct("sent");await showComments(track,panel)}
   else if(res.status===429){feedback.textContent=ct("slow")}
   else{const result=await res.json().catch(()=>({}));feedback.textContent=result.error||ct("problem")}
  }catch(e){feedback.textContent=ct("problem")}
  finally{send.disabled=false}
 };
 showComments(track,panel);
 return panel;
}
function render(){
 const wrap=$("tracks");wrap.replaceChildren();$("count").textContent=total+" "+t("songs");
 $("page-info").textContent=({it:"Pagina ",ro:"Pagina ",en:"Page "})[language]+page+" / "+totalPages;
 $("page-prev").disabled=page<=1;$("page-next").disabled=page>=totalPages;
 if(!allTracks.length){wrap.append(node("p","empty",t("empty")));return}
 allTracks.forEach((track,i)=>{
  const card=node("article","track");
  card.append(node("div","position","#"+((page-1)*20+i+1)));
  const cover=node("div","cover",["♫","🎵","♪","♬","🎶"][i%5]);cover.setAttribute("aria-hidden","true");card.append(cover);
  const info=node("div");
 const title=node("h2");const openTitle=node("button","track-title",track.title);openTitle.type="button";openTitle.setAttribute("aria-expanded",String(expandedTrackId===track.id));title.append(openTitle);
 info.append(title,node("p","",track.artist+" · "+track.platform));
  const preview=node("div","listen");
  if(track.audio_preview){
   const player=node("audio");player.controls=true;player.preload="none";player.setAttribute("aria-label",t("listen"));player.src=API+"/spotlight/"+encodeURIComponent(track.id)+"/audio";preview.append(player);
  }else if(safeLink(track.link)){
   const link=node("a","",t("listenExternal"));link.href=safeLink(track.link);link.target="_blank";link.rel="noopener noreferrer";preview.append(link)
  }else{preview.append(node("span","hint",t("noPreview")))}
  info.append(preview,node("div","votes","🔥 "+Number(track.votes).toLocaleString(language)+" "+t("votes")));
  const buttons=node("div","votebox");const vote=node("button","vote",voted.has(track.id)?"✅ "+t("voted"):"👍 "+t("vote"));vote.disabled=voted.has(track.id);vote.type="button";
  vote.onclick=async()=>{vote.disabled=true;const prior=vote.textContent;vote.textContent="…";
   try{const resp=await fetch(API+"/spotlight/"+encodeURIComponent(track.id)+"/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({visitor}),credentials:"omit"});const data=await resp.json().catch(()=>({}));
    if(resp.status===201||resp.status===409){voted.add(track.id);localStorage.setItem("rdi-spotlight-voted",JSON.stringify([...voted]));$("status").textContent=resp.status===201?t("thanks"):t("duplicate");await load();return}
    $("status").textContent=resp.status===429?t("limited"):(data.error||t("failed"));
   }catch(e){$("status").textContent=t("failed")}vote.disabled=voted.has(track.id);vote.textContent=voted.has(track.id)?"✅ "+t("voted"):prior};
  const commentsButton=node("button","comment-toggle",expandedTrackId===track.id?ct("hide"):ct("show"));
  commentsButton.type="button";commentsButton.setAttribute("aria-expanded",String(expandedTrackId===track.id));
  const toggle=()=>{expandedTrackId=expandedTrackId===track.id?null:track.id;render()};
  openTitle.onclick=toggle;commentsButton.onclick=toggle;
  buttons.append(commentsButton,vote);card.append(info,buttons);
  if(expandedTrackId===track.id){card.classList.add("open");card.append(buildComments(track))}
  wrap.append(card);
 })
}
async function load(){$("status").textContent=t("loading");try{const response=await fetch(API+"/spotlight?page="+page,{cache:"no-store",credentials:"omit"});if(!response.ok)throw Error(String(response.status));const data=await response.json();allTracks=Array.isArray(data.tracks)?data.tracks:[];total=Number(data.total)||0;totalPages=Math.max(1,Number(data.total_pages)||1);if(page>totalPages){page=totalPages;return load()}$("status").textContent="";render()}catch(e){$("status").textContent=t("error");allTracks=[];$("tracks").replaceChildren()}}
$("page-prev").onclick=()=>{if(page>1){page--;expandedTrackId=null;load();$("heading").scrollIntoView({behavior:"smooth",block:"start"})}};
$("page-next").onclick=()=>{if(page<totalPages){page++;expandedTrackId=null;load();$("heading").scrollIntoView({behavior:"smooth",block:"start"})}};
const playlistAudio=$("playlist-player");
async function prepareQueue(){
 try{const response=await fetch(API+"/spotlight/playlist",{cache:"no-store",credentials:"omit"});if(!response.ok)throw Error(String(response.status));const data=await response.json();playQueue=Array.isArray(data.tracks)?data.tracks:[];return playQueue}catch(e){playQueue=[];return []}
}
function playAt(index){
 if(index<0||index>=playQueue.length){playIndex=-1;playlistAudio.pause();playlistAudio.removeAttribute("src");playlistAudio.load();$("player-label").textContent="🎵 Playlist terminata";return}
 playIndex=index;const item=playQueue[index];playlistAudio.src=API+"/spotlight/"+encodeURIComponent(item.id)+"/audio";
 $("player-label").textContent="🎶 "+item.title+" · "+item.artist+" ("+(index+1)+"/"+playQueue.length+")";
 const result=playlistAudio.play();if(result&&result.catch)result.catch(()=>{$("player-label").textContent="▶ Premi Play nel lettore per iniziare · "+item.title});
}
playlistAudio.onended=()=>playAt(playIndex+1);
playlistAudio.onerror=()=>{if(playIndex>=0&&playIndex+1<playQueue.length)playAt(playIndex+1)};
$("play-all").onclick=async()=>{
 $("player-label").textContent="🎵 Preparazione playlist…";
 if(!playQueue.length)await prepareQueue();
 if(!playQueue.length){$("player-label").textContent=({it:"Nessun file audio autorizzato per Play All",ro:"Nu există fișiere autorizate pentru redare",en:"No consented audio files available for Play All"})[language];return}
 playAt(0)
};
$("player-stop").onclick=()=>{playlistAudio.pause();playIndex=-1;playlistAudio.removeAttribute("src");playlistAudio.load();$("player-label").textContent="■ Stop"};
translate();load();prepareQueue();
</script></body></html>
